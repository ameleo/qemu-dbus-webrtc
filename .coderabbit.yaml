# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AI review of pull requests (CodeRabbit). Reviews are advisory: maintainers decide.
language: en-US
tone_instructions: "Be concise. Report only defects with a concrete failure: incorrect behavior, security, protocol or specification violations, data loss. No style, naming, documentation or test-coverage suggestions."
reviews:
  # Only the most important findings.
  profile: quiet
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!target/**"
    - "!**/Cargo.lock"
  path_instructions:
    - path: "**/*.rs"
      instructions: |
        - New source files start with `// SPDX-License-Identifier: MPL-2.0`.
        - Flag unsafe code without a SAFETY comment, panics on input from the network, the
          guest or QEMU, and blocking calls on async threads.
        - Check that WebRTC, RTP and QEMU D-Bus usage matches the specifications and the
          QEMU D-Bus display interfaces.
    - path: ".github/workflows/**"
      instructions: |
        - Keep `permissions` minimal and avoid third-party actions where a few shell lines do.
        - Never expose secrets to workflows triggered by pull requests from forks.
chat:
  auto_reply: true
