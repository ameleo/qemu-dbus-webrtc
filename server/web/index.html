<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Console</title>
<style>
  :root {
    --surface: rgba(30, 31, 36, .92);
    --surface-solid: #1e1f24;
    --raised: #2a2b31;
    --line: rgba(255, 255, 255, .09);
    --text: #ececf0;
    --muted: #9a9ba5;
    --accent: #4f8ef7;
    --accent-soft: rgba(79, 142, 247, .18);
    --good: #3ecf8e;
    --fair: #f5b041;
    --poor: #f0605a;
    --danger: #e5484d;
    --radius: 10px;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 0 rgba(255, 255, 255, .04) inset;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
               font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #cursor { position: fixed; pointer-events: none; display: none; }
  button { font: inherit; color: inherit; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* The toolbar: a tab at the top; the bar comes down over it, and goes back up. */
  #bar { position: fixed; top: 0; left: 50%; z-index: 10; display: flex; flex-direction: column;
         align-items: center; transform: translate(-50%, 0); transition: transform .22s ease; }
  #bar.collapsed { transform: translate(-50%, calc(-100% + 13px)); }
  #bar.collapsed #bar-body { opacity: 0; }
  #bar-body { display: flex; align-items: center; gap: 2px; padding: 5px 6px; margin-top: 6px; transition: opacity .22s ease;
              background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
              box-shadow: var(--shadow); backdrop-filter: blur(12px); }
  #bar-tab { width: 46px; height: 14px; margin-top: -1px; padding: 0; border: 1px solid var(--line);
             border-top: 0; border-radius: 0 0 8px 8px; background: var(--surface); color: var(--muted);
             display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #bar-tab svg { width: 14px; height: 14px; transition: transform .22s ease; }
  #bar:not(.collapsed) #bar-tab svg { transform: rotate(180deg); }
  #identity { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 8px; white-space: nowrap; }
  #vm-name { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  #latency { color: var(--muted); font-variant-numeric: tabular-nums; }
  #quality { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #quality.good { background: var(--good); box-shadow: 0 0 0 3px rgba(62, 207, 142, .18); }
  #quality.fair { background: var(--fair); box-shadow: 0 0 0 3px rgba(245, 176, 65, .18); }
  #quality.poor { background: var(--poor); box-shadow: 0 0 0 3px rgba(240, 96, 90, .18); }
  .badge { padding: 1px 7px; border-radius: 999px; background: var(--raised); color: var(--muted); font-size: 11px; }
  .sep { width: 1px; height: 20px; margin: 0 4px; background: var(--line); }
  .tool { position: relative; width: 34px; height: 32px; border: 0; border-radius: 7px; background: transparent;
          color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .tool:hover { background: rgba(255, 255, 255, .08); }
  .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tool.on { background: var(--accent-soft); color: var(--accent); }
  .tool.live { background: var(--accent); color: #fff; }
  .tool.danger:hover { background: rgba(229, 72, 77, .18); color: var(--danger); }
  .tool .off-line { display: none; }
  .tool.off .off-line { display: inline; }

  /* The connection details. */
  #panel { position: fixed; top: 64px; left: 50%; z-index: 9; width: min(420px, calc(100vw - 32px));
           transform: translateX(-50%); padding: 14px 16px 12px; background: var(--surface);
           border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
           backdrop-filter: blur(12px); }
  #panel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #panel h2 { margin: 0; font-size: 13px; font-weight: 600; }
  #panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px; margin: 0; }
  #panel dt { color: var(--muted); }
  #panel dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #panel dd .level { font-weight: 600; }
  #panel dd .level.good { color: var(--good); }
  #panel dd .level.fair { color: var(--fair); }
  #panel dd .level.poor { color: var(--poor); }
  #panel-tech { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  #panel-tech summary { color: var(--muted); cursor: pointer; user-select: none; }
  #panel-tech summary:hover { color: var(--text); }
  #panel-tech[open] summary { margin-bottom: 8px; }
  #panel-tech dl { font-size: 12px; }

  /* Cards over the screen: connecting, signing in, the end of a session. */
  #overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
             padding: 16px; background: radial-gradient(ellipse at center, rgba(20, 22, 30, .82), rgba(0, 0, 0, .94)); }
  #card { width: min(360px, 100%); padding: 26px 26px 22px; background: var(--surface-solid);
          border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); text-align: center; }
  #card h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  #card p { margin: 0; color: var(--muted); }
  #card-icon { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 50%; display: flex;
               align-items: center; justify-content: center; background: var(--raised); color: var(--muted); }
  #card-icon svg { width: 22px; height: 22px; }
  #card-icon.spinner { background: none; border: 3px solid var(--raised); border-top-color: var(--accent);
                       animation: spin .9s linear infinite; }
  #card-icon.spinner svg { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #card .actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  #card .actions:empty { display: none; }
  .primary, .secondary { min-width: 120px; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
  .primary { border: 0; background: var(--accent); color: #fff; }
  .primary:hover { filter: brightness(1.08); }
  .secondary { border: 1px solid var(--line); background: var(--raised); }
  #login { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; text-align: left; }
  #login label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  #login input { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #15161a;
                 color: var(--text); font: inherit; font-size: 14px; }
  #login input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #login .primary { margin-top: 6px; padding: 10px; }
  #login-message { color: var(--poor); min-height: 1.2em; font-size: 12px; }

  /* Files dragged over the page. */
  #drop { position: fixed; inset: 12px; z-index: 18; display: flex; align-items: center; justify-content: center;
          border: 2px dashed var(--accent); border-radius: 16px; background: rgba(79, 142, 247, .12);
          pointer-events: none; }
  #drop div { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--surface);
              border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 14px; }
  #drop svg { width: 22px; height: 22px; color: var(--accent); }

  /* Short messages, at the bottom. */
  .note { position: fixed; bottom: 18px; left: 50%; z-index: 15; max-width: calc(100vw - 32px);
          transform: translateX(-50%); padding: 9px 14px; background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(12px); pointer-events: none; }
  #toast { bottom: 64px; transition: opacity .2s ease; }
  #toast.fading { opacity: 0; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<img id="cursor" alt="">

<div id="bar" class="collapsed">
  <div id="bar-body" role="toolbar">
    <div id="identity">
      <span id="quality"></span>
      <span id="vm-name"></span>
      <span id="latency"></span>
      <span id="watching" class="badge" hidden></span>
    </div>
    <span class="sep"></span>
    <button id="mic" class="tool off" type="button">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="off-line" d="M4 4l16 16"/></svg>
    </button>
    <button id="cam" class="tool off" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5"/><path class="off-line" d="M3 4l17 17"/></svg>
    </button>
    <button id="screens" class="tool" type="button" hidden>
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="9" height="7" rx="1.2"/><rect x="13" y="5" width="9" height="7" rx="1.2"/><path d="M6.5 12v3M17.5 12v3M4.5 15h4M15.5 15h4"/></svg>
    </button>
    <button id="fullscreen" class="tool" type="button">
      <svg viewBox="0 0 24 24"><path id="fullscreen-path" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="cad" class="tool" type="button">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
    <span class="sep"></span>
    <button id="details" class="tool" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    </button>
    <button id="leave" class="tool danger" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
    </button>
  </div>
  <button id="bar-tab" type="button"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<aside id="panel" hidden>
  <header><h2 id="panel-title"></h2>
    <button id="panel-close" class="tool" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <dl id="panel-rows"></dl>
  <details id="panel-tech">
    <summary id="panel-tech-title"></summary>
    <dl id="panel-tech-rows"></dl>
  </details>
</aside>

<div id="overlay">
  <div id="card" role="dialog" aria-live="polite">
    <div id="card-icon" class="spinner"><svg viewBox="0 0 24 24"><path id="card-icon-path" d=""/></svg></div>
    <h1 id="card-title"></h1>
    <p id="card-text"></p>
    <form id="login" hidden>
      <label><span id="login-user-label"></span><input id="login-user" autocomplete="username" required></label>
      <label><span id="login-password-label"></span><input id="login-password" type="password" autocomplete="current-password" required></label>
      <div id="login-message"></div>
      <button id="login-submit" class="primary" type="submit"></button>
    </form>
    <div id="card-actions" class="actions"></div>
  </div>
</div>

<div id="drop" hidden><div><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="drop-text"></span></div></div>
<div id="toast" class="note" hidden></div>
<div id="hint" class="note" hidden></div>
<script>
"use strict";
const video = document.getElementById("video");
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------------------------
// The page's words, in the browser's language when the page has it, English otherwise.
const WORDS = {
  en: {
    console: "Console",
    connecting: "Connecting…",
    connectingTo: "Connecting to the virtual machine.",
    signIn: "Sign in",
    signInText: "This virtual machine asks for an account.",
    user: "User",
    password: "Password",
    wrongPassword: "Wrong user or password.",
    reconnecting: "Connection lost",
    reconnectingIn: (s, n, max) => `Trying again in ${s} s (attempt ${n} of ${max}).`,
    retryNow: "Try now",
    reconnect: "Reconnect",
    takeBack: "Take the session back",
    lostTitle: "Disconnected",
    lostText: "The connection to the server was lost.",
    serverFailed: "The session failed on the server.",
    serverStopped: "The server stopped.",
    endedTitle: "Session ended",
    endedText: "The session ended.",
    leftText: "You left the session.",
    takenOverTitle: "Session taken over",
    takenOverText: "The session was opened from another place.",
    errorTitle: "Cannot connect",
    watching: "View only",
    micOff: "Microphone: off. Click to let the guest use it.",
    micReady: "Microphone: allowed. It opens when an application of the guest records.",
    micOn: "Microphone: in use by the guest. Click to stop.",
    micBlocked: "The browser blocks the microphone for this site.",
    micHttps: "The microphone needs a secure (HTTPS) connection.",
    micError: (m) => `Microphone: ${m}`,
    camOff: "Camera: off. Click to show it in the guest.",
    camShown: "Camera: shown in the guest. Click to remove it.",
    camLive: "Camera: in use by the guest. Click to remove it.",
    camNotShown: (m) => `The guest cannot show the camera: ${m}`,
    camNone: (m) => `No camera: ${m}`,
    screensStart: "All monitors: one screen of the guest on each monitor.",
    screensStop: "Back to one monitor",
    screensOpen: (n) => `Click to open screen ${n}.`,
    screensAgain: "Click again to go full screen on all monitors.",
    screensOne: "This computer has one monitor.",
    screensUnavailable: (m) => `The monitors are not available: ${m}`,
    screenTitle: (name, n) => `${name}: screen ${n}`,
    fullScreen: "Full screen",
    fullScreenExit: "Exit full screen",
    fullScreenHold: "Hold Esc to exit full screen.",
    cad: "Send Ctrl+Alt+Del",
    cadSent: "Ctrl+Alt+Del sent.",
    details: "Connection details",
    leave: "Disconnect",
    hint: "Click the screen to use the guest's mouse; Esc gives it back.",
    dropHere: "Drop to copy into the virtual machine",
    filesReady: (n) => `${n} ${n === 1 ? "file" : "files"} ready: paste in the virtual machine (Ctrl+V).`,
    filesNone: "Nothing to copy: no file in what was dropped.",
    info: {
      quality: "Quality", levels: { good: "Good", fair: "Fair", poor: "Poor" },
      causes: {
        losses: "data lost on the network", slowNetwork: "slow network",
        unsteadyNetwork: "unsteady network", slowDecoding: "this computer decodes slowly",
        busyServer: "busy server", lowBandwidth: "low bandwidth",
      },
      responsiveness: "Responsiveness", picture: "Picture",
      pictureValue: (w, h, fps) => `${w} × ${h}, ${fps} frames/s`,
      bitrate: "Bitrate", bitrateValue: (now, of) => of ? `${now} Mbit/s of ${of} Mbit/s available` : `${now} Mbit/s`,
      video: "Video", byGpu: "decoded by the graphics card", byCpu: "decoded by the processor",
      sound: "Sound", smooth: "Smooth", someGaps: "A few dropouts", manyGaps: "Frequent dropouts",
      technical: "Technical details",
    },
    rows: {
      codec: "Codec", decoder: "Decoder", hardware: "hardware", size: "Resolution", fps: "Frame rate",
      bitrate: "Bitrate", estimate: "Bandwidth estimate", latency: "Latency", breakdown: "Of which",
      breakdownValue: (server, network, here) => `server ${server}, network ${network}, browser ${here}`,
      lost: "Lost", lostValue: (p, pli, f) => `packets ${p} · keyframe requests ${pli} · freezes ${f}`,
      jitter: "Jitter", sound: "Sound",
      browser: "In the browser",
      browserValue: (assembly, buffer, decode) => `receiving ${assembly}, buffer ${buffer}, decoding ${decode}`,
      soundValue: (jitter, concealed, buffer, lost) => `jitter ${jitter} ms, concealed ${concealed} %, buffer ${buffer} ms, lost ${lost}`,
      connection: "Connection",
    },
  },
  fr: {
    console: "Console",
    connecting: "Connexion…",
    connectingTo: "Connexion à la machine virtuelle.",
    signIn: "Connexion",
    signInText: "Cette machine virtuelle demande un compte.",
    user: "Utilisateur",
    password: "Mot de passe",
    wrongPassword: "Utilisateur ou mot de passe incorrect.",
    reconnecting: "Connexion perdue",
    reconnectingIn: (s, n, max) => `Nouvelle tentative dans ${s} s (essai ${n} sur ${max}).`,
    retryNow: "Réessayer",
    reconnect: "Se reconnecter",
    takeBack: "Reprendre la session",
    lostTitle: "Déconnecté",
    lostText: "La connexion au serveur a été perdue.",
    serverFailed: "La session a échoué sur le serveur.",
    serverStopped: "Le serveur s'est arrêté.",
    endedTitle: "Session terminée",
    endedText: "La session est terminée.",
    leftText: "Vous avez quitté la session.",
    takenOverTitle: "Session reprise ailleurs",
    takenOverText: "La session a été ouverte depuis un autre poste.",
    errorTitle: "Connexion impossible",
    watching: "Observation",
    micOff: "Micro : coupé. Cliquez pour le confier à la machine.",
    micReady: "Micro : autorisé. Il s'ouvre quand une application de la machine enregistre.",
    micOn: "Micro : utilisé par la machine. Cliquez pour le couper.",
    micBlocked: "Le navigateur bloque le micro pour ce site.",
    micHttps: "Le micro demande une connexion sécurisée (HTTPS).",
    micError: (m) => `Micro : ${m}`,
    camOff: "Caméra : coupée. Cliquez pour la montrer à la machine.",
    camShown: "Caméra : présente dans la machine. Cliquez pour la retirer.",
    camLive: "Caméra : utilisée par la machine. Cliquez pour la retirer.",
    camNotShown: (m) => `La machine ne peut pas montrer la caméra : ${m}`,
    camNone: (m) => `Pas de caméra : ${m}`,
    screensStart: "Tous les écrans : un écran de la machine sur chaque moniteur.",
    screensStop: "Revenir à un seul écran",
    screensOpen: (n) => `Cliquez pour ouvrir l'écran ${n}.`,
    screensAgain: "Cliquez à nouveau pour passer en plein écran sur tous les moniteurs.",
    screensOne: "Cet ordinateur n'a qu'un moniteur.",
    screensUnavailable: (m) => `Les moniteurs ne sont pas disponibles : ${m}`,
    screenTitle: (name, n) => `${name} : écran ${n}`,
    fullScreen: "Plein écran",
    fullScreenExit: "Quitter le plein écran",
    fullScreenHold: "Maintenez Échap pour quitter le plein écran.",
    cad: "Envoyer Ctrl+Alt+Suppr",
    cadSent: "Ctrl+Alt+Suppr envoyé.",
    details: "Détails de la connexion",
    leave: "Se déconnecter",
    hint: "Cliquez sur l'écran pour utiliser la souris de la machine ; Échap la rend.",
    dropHere: "Déposez pour copier dans la machine virtuelle",
    filesReady: (n) => `${n} ${n === 1 ? "fichier prêt" : "fichiers prêts"} : collez dans la machine virtuelle (Ctrl+V).`,
    filesNone: "Rien à copier : aucun fichier dans le dépôt.",
    info: {
      quality: "Qualité", levels: { good: "Bonne", fair: "Moyenne", poor: "Faible" },
      causes: {
        losses: "pertes sur le réseau", slowNetwork: "réseau lent",
        unsteadyNetwork: "réseau irrégulier", slowDecoding: "décodage lent sur ce poste",
        busyServer: "serveur chargé", lowBandwidth: "bande passante faible",
      },
      responsiveness: "Réactivité", picture: "Image",
      pictureValue: (w, h, fps) => `${w} × ${h}, ${fps} images/s`,
      bitrate: "Débit", bitrateValue: (now, of) => of ? `${now} Mbit/s sur ${of} Mbit/s disponibles` : `${now} Mbit/s`,
      video: "Vidéo", byGpu: "décodée par la carte graphique", byCpu: "décodée par le processeur",
      sound: "Son", smooth: "Fluide", someGaps: "Quelques coupures", manyGaps: "Coupures fréquentes",
      technical: "Détails techniques",
    },
    rows: {
      codec: "Codec", decoder: "Décodeur", hardware: "matériel", size: "Résolution", fps: "Images/s",
      bitrate: "Débit", estimate: "Bande passante estimée", latency: "Latence", breakdown: "Dont",
      breakdownValue: (server, network, here) => `serveur ${server}, réseau ${network}, navigateur ${here}`,
      lost: "Pertes", lostValue: (p, pli, f) => `paquets ${p} · images clés demandées ${pli} · gels ${f}`,
      jitter: "Gigue", sound: "Son",
      browser: "Dans le navigateur",
      browserValue: (assembly, buffer, decode) => `réception ${assembly}, tampon ${buffer}, décodage ${decode}`,
      soundValue: (jitter, concealed, buffer, lost) => `gigue ${jitter} ms, masqué ${concealed} %, tampon ${buffer} ms, perdus ${lost}`,
      connection: "Connexion",
    },
  },
};
const lang = (navigator.languages || [navigator.language]).map((l) => l.slice(0, 2).toLowerCase())
  .find((l) => l in WORDS) || "en";
const T = WORDS[lang];
document.documentElement.lang = lang;
// A number with `digits` decimals, written as the language writes it.
const num = (v, digits = 1) => v.toLocaleString(lang, { minimumFractionDigits: digits, maximumFractionDigits: digits });

// What the page calls the VM: its name, once the server gave it.
let vmName = "";
function setName(name) {
  vmName = name;
  $("vm-name").textContent = name || T.console;
  document.title = name || T.console;
}
setName("");

// ---------------------------------------------------------------------------------------------
// The card over the screen: `icon` "spin" for a wait, or an icon path; `actions` buttons as
// [label, what to do, primary?]; `login` shows the sign-in form.
const ICONS = {
  lost: "M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19h.01M3 3l18 18",
  ended: "M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0",
  error: "M12 8v5M12 16h.01M10.3 3.9L2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
  lock: "M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z",
  swap: "M7 7h13l-4-4M17 17H4l4 4",
};
const card = {
  show({ icon = "spin", title = "", text = "", actions = [], login = false }) {
    $("overlay").hidden = false;
    // Nothing of the session's over the card: the toolbar up, the details closed.
    $("panel").hidden = true;
    $("details").classList.remove("on");
    bar.el.classList.add("collapsed");
    $("card-icon").className = icon === "spin" ? "spinner" : "";
    $("card-icon-path").setAttribute("d", icon === "spin" ? "" : ICONS[icon] || "");
    $("card-title").textContent = title;
    $("card-text").textContent = text;
    $("login").hidden = !login;
    const box = $("card-actions");
    box.replaceChildren(...actions.map(([label, run, primary = true]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = primary ? "primary" : "secondary";
      b.textContent = label;
      b.addEventListener("click", run);
      return b;
    }));
    box.querySelector("button")?.focus();
  },
  hide() { $("overlay").hidden = true; },
  shown: () => !$("overlay").hidden,
};

// A short message at the bottom, for a few seconds.
const toast = {
  timer: null,
  show(text, ms = 3500) {

    el.hidden = false;

};

// The toolbar: collapsed to its tab, down while the pointer is over it, the details are open,
// or for a moment when the session starts.
const bar = {
  el: $("bar"),

});
// The tools take no key: keys go to the guest.
for (const b of document.querySelectorAll("#bar button, #panel button")) {
  b.addEventListener("click", () => b.blur());
}
// Tooltips.
const tip = (id, text) => { $(id).title = text; $(id).setAttribute("aria-label", text); };
tip("cad", T.cad);
tip("details", T.details);
tip("leave", T.leave);
tip("fullscreen", T.fullScreen);
tip("bar-tab", T.console);
$("panel-title").textContent = T.details;
$("panel-tech-title").textContent = T.info.technical;
$("login-user-label").textContent = T.user;
$("login-password-label").textContent = T.password;

$("watching").textContent = T.watching;

// Protocol Buffers, just what the messages of crates/protocol/proto/qdw.proto need:
// varints and length-delimited fields (strings, nested messages).
const pb = {
  utf8: new TextEncoder(),
  text: new TextDecoder(),
  varint(out, n) {
    while (n > 0x7f) { out.push((n & 0x7f) | 0x80); n = Math.floor(n / 128); }
    out.push(n);
  },
  bytes(out, field, bytes) { pb.varint(out, (field << 3) | 2); pb.varint(out, bytes.length); for (const b of bytes) out.push(b); },
  string(out, field, s) { pb.bytes(out, field, pb.utf8.encode(s)); },
  uint(out, field, n) { pb.varint(out, field << 3); pb.varint(out, n); },
  // int32: a negative value is sent as its 64-bit two's complement.
  int(out, field, n) {
    pb.varint(out, field << 3);
    let v = BigInt.asUintN(64, BigInt(n));
    while (v > 0x7fn) { out.push(Number(v & 0x7fn) | 0x80); v >>= 7n; }
    out.push(Number(v));
  },
  message(build) { const out = []; build(out); return out; },
  // The fields of a message: field number -> list of values (numbers, or byte arrays).
  parse(bytes) {
    const fields = new Map();
    let i = 0;
    const varint = () => { let n = 0, shift = 1, b; do { b = bytes[i++]; n += (b & 0x7f) * shift; shift *= 128; } while (b & 0x80); return n; };
    while (i < bytes.length) {
      const key = varint(), field = Math.floor(key / 8), wire = key & 7;
      let value;
      if (wire === 0) value = varint();
      else if (wire === 2) { const n = varint(); value = bytes.subarray(i, i + n); i += n; }
      else if (wire === 1) { i += 8; continue; }
      else if (wire === 5) { i += 4; continue; }
      else throw new Error(`wire type ${wire}`);
      if (!fields.has(field)) fields.set(field, []);
      fields.get(field).push(value);
    }
    return fields;
  },
};
const str = (fields, n) => pb.text.decode(fields.get(n)?.[0] || new Uint8Array());
const uint = (fields, n) => fields.get(n)?.[0] || 0;

// ClientMessage: hello = 1, answer = 2, ice = 3.
// Hello: codecs = 1, shadow = 2, user = 3, password = 4. With ?shadow in the address, the page
// only watches.
const shadow = new URLSearchParams(location.search).has("shadow");
const hello = (codecs, account) => pb.message((o) => pb.bytes(o, 1, pb.message((h) => {
  codecs.forEach((c) => pb.string(h, 1, c));
  if (shadow) pb.uint(h, 2, 1);
  if (account.user) { pb.string(h, 3, account.user); pb.string(h, 4, account.password); }
})));
const answer = (sdp) => pb.message((o) => pb.bytes(o, 2, pb.message((d) => pb.string(d, 1, sdp))));
const ice = (candidate, mline) => pb.message((o) => pb.bytes(o, 3, pb.message((c) => { pb.string(c, 1, candidate); pb.uint(c, 2, mline); })));

// The VM's signalling, next to its page (/vm/<uuid>/signal), and the peer connection, both new
// for each connection: first with no account, then, if the server asks for one, with what the
// login form gets. A connection lost (the network, a failure or a restart of the server) is
// tried again a few times, with the same account; the end of a session, or a refusal, is not.
let ws = null;
let pc = null;
let account = { user: "", password: "" };
const send = (bytes) => { if (ws?.readyState === WebSocket.OPEN) ws.send(new Uint8Array(bytes)); };

// The video and the sound play in one element. Browsers play sound only after the user did
// something on the page: the element starts muted, and the first click or key unmutes it.
let media = new MediaStream();
const unmute = () => { video.muted = false; };
window.addEventListener("pointerdown", unmute, { once: true });
window.addEventListener("keydown", unmute, { once: true });
// Every data channel of the connection, by its label: those the page uses, and the others, for
// debugging.
let channels = {};

function newPeer() {
  const peer = new RTCPeerConnection();
  pc = peer;
  peer.ontrack = (event) => {
    if (peer !== pc) return;
    // The screen and the sound; the camera tracks only go the other way.
    const screen = peer.getTransceivers().find((t) => t.receiver.track.kind === "video");
    if (event.track.kind === "video" && event.transceiver !== screen) return;
    media.addTrack(event.track);
    if (video.srcObject !== media) video.srcObject = media;
    // Firefox stops playing when a track joins the stream: play again (nothing in Chrome).
    video.play().catch(() => {});
  };
  peer.ondatachannel = ({ channel }) => {
    if (peer !== pc) return;
    channels[channel.label] = channel;
    channel.binaryType = "arraybuffer";
    if (channel.label === "input") input.channel = channel;
    if (channel.label === "pointer") channel.onmessage = (event) => pointerUpdate(new Uint8Array(event.data));
    if (channel.label === "camera") {
      camera.channel = channel;
      channel.onmessage = (event) => cameraMessage(new Uint8Array(event.data));
    }
    if (channel.label === "control") {
      control.channel = channel;
      channel.onopen = () => { control.videoPause(); control.layout(); };
      // ControlMessage: bandwidth_estimate = 3, microphone = 4, pointer_mode = 5,
      // encode_latency = 6; BandwidthEstimate: kbps = 1; Microphone: wanted = 1; PointerMode:
      // relative = 1; EncodeLatency: screen = 1, mean_us = 2, max_us = 3.
      channel.onmessage = (event) => {
        const message = pb.parse(new Uint8Array(event.data));
        if (message.has(3)) control.estimate = uint(pb.parse(message.get(3)[0]), 1);
        if (message.has(6)) {
          const latency = pb.parse(message.get(6)[0]);
          control.latency[uint(latency, 1)] = { mean: uint(latency, 2) / 1000, max: uint(latency, 3) / 1000 };
        }
        if (message.has(5)) pointer.setRelative(uint(pb.parse(message.get(5)[0]), 1) === 1);
        if (message.has(4)) {
          mic.wanted = uint(pb.parse(message.get(4)[0]), 1) === 1;
          mic.apply();
        }
      };
    }
    if (channel.label === "clipboard") {
      clip.channel = channel;
      channel.onmessage = (event) => clipboardMessage(new Uint8Array(event.data));
      channel.onopen = () => clip.focused();
    }
  };
  peer.onicecandidate = (event) => {
    if (peer === pc && event.candidate) send(ice(event.candidate.candidate, event.candidate.sdpMLineIndex || 0));
  };
  peer.onconnectionstatechange = () => {
    if (peer === pc && peer.connectionState === "failed") session.lost(T.lostText);
  };
}

// The mids of the video tracks an offer only receives: the cameras' tracks.
function cameraTracks(sdp) {
  const mids = new Set();
  for (const section of sdp.split(/\r?\nm=/).slice(1)) {
    if (section.startsWith("video") && /\r?\na=recvonly/.test(section)) {
      const mid = section.match(/\r?\na=mid:(\S+)/);
      if (mid) mids.add(mid[1]);
    }
  }
  return mids;
}

// The session, as the page shows it: "connecting", "login", "live", "retrying" (a connection
// lost, tried again) or "ended".
const RETRIES = 5;
const session = {
  phase: "connecting",
  // Connections tried since the session last showed the screen.
  attempt: 0,
  timer: null,
  connect() {
    clearTimeout(this.timer);
    this.teardown();
    if (this.phase !== "retrying") this.phase = "connecting";
    card.show({ title: this.phase === "retrying" ? T.reconnecting : T.connecting, text: T.connectingTo });
    newPeer();
    const socket = new WebSocket(`wss://${location.host}${location.pathname.replace(/\/?$/, "/")}signal`);
    ws = socket;
    socket.binaryType = "arraybuffer";
    socket.onopen = () => {
      // Tell the server which video codecs this browser decodes, and the account, if any.
      // Each with its parameters ("video/VP9;profile-id=1"): the server checks the profile too.
      const codecs = (RTCRtpReceiver.getCapabilities("video")?.codecs || [])
        .map((c) => c.mimeType + (c.sdpFmtpLine ? `;${c.sdpFmtpLine}` : ""));
      send(hello([...new Set(codecs)], account));
    };
    socket.onmessage = (event) => { if (socket === ws) onMessage(event); };
    // The close status says how the session ended (RFC 6455 7.4.1): 1000 a normal end, 1001 the
    // server going away, 1011 a failure of the server; no close frame, the connection lost.
    socket.onclose = (event) => {
      if (socket !== ws || this.phase === "ended" || this.phase === "login") return;
      if (!event.wasClean) this.lost(T.lostText);
      else if (event.code === 1011) this.lost(T.serverFailed);
      else if (event.code === 1001) this.lost(T.serverStopped);
      else this.end({ icon: "ended", title: T.endedTitle, text: T.endedText });
    };
  },
  // The screen shows: the session is on.
  live() {
    if (this.phase === "live" || this.phase === "ended") return;
    const first = this.phase === "connecting";
    this.phase = "live";
    this.attempt = 0;
    card.hide();
    if (first) bar.show(2500);
  },
  // The connection is lost: try again, a few times, then give up.
  lost(reason) {
    if (this.phase === "ended" || this.phase === "login") return;
    this.teardown();
    if (this.attempt >= RETRIES) {
      this.end({ icon: "lost", title: T.lostTitle, text: reason });
      return;
    }
    this.attempt += 1;
    this.phase = "retrying";
    let left = Math.min(15, 2 ** (this.attempt - 1));
    const tick = () => {
      card.show({
        icon: "lost", title: T.reconnecting, text: `${reason} ${T.reconnectingIn(left, this.attempt, RETRIES)}`,
        actions: [[T.retryNow, () => this.connect()]],
      });
      if (left-- <= 0) this.connect();
      else this.timer = setTimeout(tick, 1000);
    };
    tick();
  },
  // The session is over: the card says why, with what the user can do.
  end({ icon, title, text, again = T.reconnect }) {
    clearTimeout(this.timer);
    this.teardown();
    this.phase = "ended";
    card.show({ icon, title, text, actions: [[again, () => { this.attempt = 0; this.connect(); }]] });
  },
  // The user leaves: a clean close, which the server takes as the client leaving.
  leave() {
    this.end({ icon: "ended", title: T.endedTitle, text: T.leftText });
  },
  // Close the connection, and forget what came on it.
  teardown() {
    const socket = ws, peer = pc;
    ws = null;
    pc = null;
    if (socket) {
      socket.onopen = socket.onmessage = socket.onclose = null;
      if (socket.readyState <= WebSocket.OPEN) socket.close(1000, "the client leaves");
    }
    peer?.close();
    screens.stop();
    screens.transceivers = [];
    screens.offered();
    media = new MediaStream();
    video.srcObject = null;
    channels = {};
    input.channel = null;
    input.keys.clear();
    input.buttons.clear();
    input.syncLocks = true;
    control.channel = null;
    control.estimate = null;
    control.latency = [];
    clip.channel = null;
    clip.answers.clear();
    clip.locked.clear();
    clip.guest = [];
    camera.reset();
    mic.reset();
    pointer.reset();
    quality.reset();
  },
};
video.addEventListener("playing", () => session.live());

// Leaving the page (closed, reloaded, or another address) ends the session with a clean close,
// as the native client does: the server takes it as the client leaving, not as a network failure.
window.addEventListener("pagehide", () => {
  for (const v of views.slice(1)) v.win.close();
  session.phase = "ended";
  session.teardown();
});

// ServerMessage: offer = 1, ice = 2, error = 3, ended = 4; SessionDescription: sdp = 1,
// vm_name = 2, ice_servers = 3; Ended: reason = 1 (1 another client took the session over, 2
// the server stops). The server ends a session by closing the WebSocket cleanly.
const onMessage = async (event) => {
  const message = pb.parse(new Uint8Array(event.data));
  const peer = pc;
  if (message.has(1)) {
    const offer = pb.parse(message.get(1)[0]);
    setName(str(offer, 2));
    // ice_servers = 3: the STUN server the server asks, for the browser to find its own
    // public address behind a NAT; the candidates it finds go to the server as the others.
    const servers = (offer.get(3) || []).map((url) => pb.text.decode(url));
    if (servers.length) peer.setConfiguration({ ...peer.getConfiguration(), iceServers: [{ urls: servers }] });
    await peer.setRemoteDescription({ type: "offer", sdp: str(offer, 1) });
    if (peer !== pc) return;
    // Sound both ways: the microphone can then go on the sound's track without renegotiating.
    for (const t of peer.getTransceivers()) if (t.receiver.track.kind === "audio") t.direction = "sendrecv";
    // The video tracks the server receives carry the cameras, from here: sending, with no
    // track until the guest opens a camera. The others are the guest's screens.
    const cameraMids = cameraTracks(str(offer, 1));
    for (const t of peer.getTransceivers()) if (cameraMids.has(t.mid)) t.direction = "sendonly";
    // The other video tracks, in the offer's order: the guest's screens, the first shown here.
    screens.transceivers = peer.getTransceivers()
      .filter((t) => t.receiver.track.kind === "video" && !cameraMids.has(t.mid));
    screens.offered();
    await peer.setLocalDescription(await peer.createAnswer());
    if (peer === pc) send(answer(peer.localDescription.sdp));
  } else if (message.has(2)) {
    const c = pb.parse(message.get(2)[0]);
    await peer.addIceCandidate({ candidate: str(c, 1), sdpMLineIndex: uint(c, 2) });
  } else if (message.has(3)) {
    const error = str(pb.parse(message.get(3)[0]), 1);
    // The server closes next: the error says why, the close adds nothing.
    if (error === "an account is required" || error === "wrong user or password") {
      login.ask(error === "an account is required" ? "" : T.wrongPassword);
    } else {
      session.end({ icon: "error", title: T.errorTitle, text: error });
    }
  } else if (message.has(4)) {
    const reason = uint(pb.parse(message.get(4)[0]), 1);
    if (reason === 1) {
      session.end({ icon: "swap", title: T.takenOverTitle, text: T.takenOverText, again: T.takeBack });
    } else if (reason === 2) {
      session.lost(T.serverStopped);
    } else {
      session.end({ icon: "ended", title: T.endedTitle, text: T.endedText });
    }
  }
};

// The login form, shown when the server asks for an account of the VM's.
const login = {
  ask(message) {
    session.teardown();
    session.phase = "login";
    card.show({ icon: "lock", title: T.signIn, text: T.signInText, login: true });
    $("login-message").textContent = message;
    $(account.user ? "login-password" : "login-user").focus();
  },
};
$("login").addEventListener("submit", (e) => {
  e.preventDefault();
  account = { user: $("login-user").value, password: $("login-password").value };
  $("login-password").value = "";
  session.phase = "connecting";
  session.connect();
});

// ---------------------------------------------------------------------------------------------
// Keyboard and pointer, modelled on RDP: keys by position (the guest applies its own layout),
// lock keys synchronised on focus, everything released when the focus goes.

// KeyboardEvent.code -> PC scancode, set 1. 0xE000 marks the E0 prefix; Pause is apart.
const SCANCODES = {
  Escape: 0x01, Digit1: 0x02, Digit2: 0x03, Digit3: 0x04, Digit4: 0x05, Digit5: 0x06, Digit6: 0x07,
  Digit7: 0x08, Digit8: 0x09, Digit9: 0x0a, Digit0: 0x0b, Minus: 0x0c, Equal: 0x0d, Backspace: 0x0e,
  Tab: 0x0f, KeyQ: 0x10, KeyW: 0x11, KeyE: 0x12, KeyR: 0x13, KeyT: 0x14, KeyY: 0x15, KeyU: 0x16,
  KeyI: 0x17, KeyO: 0x18, KeyP: 0x19, BracketLeft: 0x1a, BracketRight: 0x1b, Enter: 0x1c,
  ControlLeft: 0x1d, KeyA: 0x1e, KeyS: 0x1f, KeyD: 0x20, KeyF: 0x21, KeyG: 0x22, KeyH: 0x23,
  KeyJ: 0x24, KeyK: 0x25, KeyL: 0x26, Semicolon: 0x27, Quote: 0x28, Backquote: 0x29,
  ShiftLeft: 0x2a, Backslash: 0x2b, KeyZ: 0x2c, KeyX: 0x2d, KeyC: 0x2e, KeyV: 0x2f, KeyB: 0x30,
  KeyN: 0x31, KeyM: 0x32, Comma: 0x33, Period: 0x34, Slash: 0x35, ShiftRight: 0x36,
  NumpadMultiply: 0x37, AltLeft: 0x38, Space: 0x39, CapsLock: 0x3a, F1: 0x3b, F2: 0x3c, F3: 0x3d,
  F4: 0x3e, F5: 0x3f, F6: 0x40, F7: 0x41, F8: 0x42, F9: 0x43, F10: 0x44, NumLock: 0x45,
  ScrollLock: 0x46, Numpad7: 0x47, Numpad8: 0x48, Numpad9: 0x49, NumpadSubtract: 0x4a,
  Numpad4: 0x4b, Numpad5: 0x4c, Numpad6: 0x4d, NumpadAdd: 0x4e, Numpad1: 0x4f, Numpad2: 0x50,
  Numpad3: 0x51, Numpad0: 0x52, NumpadDecimal: 0x53, IntlBackslash: 0x56, F11: 0x57, F12: 0x58,
  NumpadEqual: 0x59, KanaMode: 0x70, IntlRo: 0x73, Convert: 0x79, NonConvert: 0x7b, IntlYen: 0x7d,
  NumpadComma: 0x7e,
  NumpadEnter: 0xe01c, ControlRight: 0xe01d, AudioVolumeMute: 0xe020, MediaPlayPause: 0xe022,
  MediaStop: 0xe024, AudioVolumeDown: 0xe02e, AudioVolumeUp: 0xe030, NumpadDivide: 0xe035,
  PrintScreen: 0xe037, AltRight: 0xe038, Home: 0xe047, ArrowUp: 0xe048, PageUp: 0xe049,
  ArrowLeft: 0xe04b, ArrowRight: 0xe04d, End: 0xe04f, ArrowDown: 0xe050, PageDown: 0xe051,
  Insert: 0xe052, Delete: 0xe053, MetaLeft: 0xe05b, MetaRight: 0xe05c, ContextMenu: 0xe05d,
  MediaTrackPrevious: 0xe010, MediaTrackNext: 0xe019,
};

// Input = 1 repeated InputEvent; InputEvent: key = 1, pointer_move = 2, pointer_button = 3,
// wheel = 4, lock_keys = 5.
const ev = {
  key: (scancode, down) => pb.message((e) => pb.bytes(e, 1, pb.message((k) => {
    if (scancode === "Pause") { pb.uint(k, 1, 0x1d); pb.uint(k, 3, 1); }
    else { pb.uint(k, 1, scancode & 0x7f); pb.uint(k, 2, scancode > 0xff ? 1 : 0); }
    pb.uint(k, 4, down ? 1 : 0);
  }))),
  move: (screen, x, y) => pb.message((e) => pb.bytes(e, 2, pb.message((m) => { pb.uint(m, 1, screen); pb.uint(m, 2, x); pb.uint(m, 3, y); }))),
  button: (button, down) => pb.message((e) => pb.bytes(e, 3, pb.message((b) => { pb.uint(b, 1, button); pb.uint(b, 2, down ? 1 : 0); }))),
  wheel: (dx, dy) => pb.message((e) => pb.bytes(e, 4, pb.message((w) => { pb.int(w, 1, dx); pb.int(w, 2, dy); }))),
  motion: (dx, dy) => pb.message((e) => pb.bytes(e, 6, pb.message((m) => { pb.int(m, 1, dx); pb.int(m, 2, dy); }))),
  locks: (e) => pb.message((o) => pb.bytes(o, 5, pb.message((l) => {
    pb.uint(l, 1, e.getModifierState("CapsLock") ? 1 : 0);
    pb.uint(l, 2, e.getModifierState("NumLock") ? 1 : 0);
    pb.uint(l, 3, e.getModifierState("ScrollLock") ? 1 : 0);
  }))),
};

const input = {
  channel: null,
  keys: new Set(),        // scancodes held down
  buttons: new Set(),     // buttons held down
  syncLocks: true,        // send the lock keys with the next event
  move: null,             // the latest pointer position, [screen, x, y], sent once per frame
  motion: [0, 0],         // relative moves not sent yet, in guest pixels, sent once per frame
  motionDue: false,       // a frame will send them
  send(events) {
    if (this.channel?.readyState !== "open" || events.length === 0) return;
    this.channel.send(new Uint8Array(pb.message((o) => events.forEach((e) => pb.bytes(o, 1, e)))));
  },
  // The lock keys first, when the focus came back.
  withLocks(e, events) {
    if (this.syncLocks && e.getModifierState) { this.syncLocks = false; events.unshift(ev.locks(e)); }
    return events;
  },
  releaseAll() {
    const events = [];
    this.keys.forEach((k) => events.push(ev.key(k, false)));
    this.buttons.forEach((b) => events.push(ev.button(b, false)));
    this.keys.clear(); this.buttons.clear();
    this.send(events);
    this.syncLocks = true;
  },
};

// A window showing one guest screen: this page the first, and the windows it opens on the other
// monitors (see `screens`) one each. Each sends its keys, and its pointer as on its screen.
function view(screen, win, videoElement, cursorElement) {
  return {
    screen, win, video: videoElement, cursor: cursorElement,
    // The guest pointer on this screen: its shape (as a CSS cursor, and an image), whether the
    // guest shows it here, and where (relative pointer only).
    css: "default", image: "", hot: [0, 0], visible: true, position: null,
  };
}
const cursor = document.getElementById("cursor");
const views = [view(0, window, video, cursor)];

// The keys the local system takes for itself unless the page holds the keyboard, which a browser
// allows in full screen only (the Keyboard Lock API, `keyboard.lock()`): in a window, the Windows
// key would open both Start menus, the local one and the guest's. As Remote Desktop does by
// default, it then stays local; in full screen, every key goes to the guest.
const LOCAL_KEYS = new Set(["MetaLeft", "MetaRight"]);
const localKey = (v, e) => LOCAL_KEYS.has(e.code) && !v.win.document.fullscreenElement;

function listen(v) {
  v.win.addEventListener("keydown", (e) => {
    if (card.shown()) return;   // a card over the screen: typing in the login form, or nothing
    const scancode = e.code === "Pause" ? "Pause" : SCANCODES[e.code];
    if (scancode === undefined || localKey(v, e)) return;
    e.preventDefault();
    input.keys.add(scancode);
    input.send(input.withLocks(e, [ev.key(scancode, true)]));
  });
  v.win.addEventListener("keyup", (e) => {
    if (card.shown()) return;
    const scancode = e.code === "Pause" ? "Pause" : SCANCODES[e.code];
    if (scancode === undefined || !input.keys.has(scancode)) return;
    e.preventDefault();
    input.keys.delete(scancode);
    input.send([ev.key(scancode, false)]);
  });
  v.win.addEventListener("blur", () => input.releaseAll());
  v.win.document.addEventListener("visibilitychange", () => {
    if (v.win.document.hidden) input.releaseAll();
    control.videoPause();
  });

  const video = v.video;
  video.addEventListener("pointermove", (e) => {
    if (shadow) return;
    if (pointer.relative) {
      // The relative pointer stays in this page, which holds it.
      if (v.screen !== 0 || !pointer.locked()) return;
      const scale = guestScale(v);
      input.motion[0] += e.movementX * scale;
      input.motion[1] += e.movementY * scale;
      if (!input.motionDue) {
        input.motionDue = true;
        v.win.requestAnimationFrame(() => {
          input.motionDue = false;
          // Whole pixels; the rest waits for the next moves.
          const [dx, dy] = input.motion.map(Math.trunc);
          input.motion[0] -= dx;
          input.motion[1] -= dy;
          if (dx || dy) input.send(input.withLocks(e, [ev.motion(dx, dy)]));
        });
      }
      return;
    }
    const at = locate(e, v);
    if (!at) return;
    if (input.syncLocks) input.send(input.withLocks(e, []));
    if (!input.move) {
      v.win.requestAnimationFrame(() => { const [screen, x, y] = input.move; input.move = null; input.send([ev.move(screen, x, y)]); });
    }
    input.move = at;
  });
  video.addEventListener("pointerdown", (e) => {
    const button = BUTTONS[e.button];
    if (shadow) return;
    if (pointer.relative) {
      e.preventDefault();
      if (v.screen !== 0) return;
      // The first click takes the pointer, and goes no further.
      if (!pointer.locked()) { video.requestPointerLock(); return; }
      if (!button) return;
      input.buttons.add(button);
      input.send(input.withLocks(e, [ev.button(button, true)]));
      return;
    }
    const p = guestPixel(e, v);
    if (!button || !p) return;
    e.preventDefault();
    video.setPointerCapture(e.pointerId);
    input.buttons.add(button);
    input.send(input.withLocks(e, [ev.move(v.screen, p[0], p[1]), ev.button(button, true)]));
  });
  video.addEventListener("pointerup", (e) => {
    const button = BUTTONS[e.button];
    if (!button) return;
    e.preventDefault();
    input.buttons.delete(button);
    input.send([ev.button(button, false)]);
  });
  video.addEventListener("contextmenu", (e) => e.preventDefault());
  // Wheel in 1/120 of a notch, positive up and right. Browsers count a notch as about 100 pixels
  // or 3 lines.
  video.addEventListener("wheel", (e) => {
    e.preventDefault();
    const unit = e.deltaMode === 0 ? 1.2 : e.deltaMode === 1 ? 40 : 120;
    input.send([ev.wheel(Math.round(e.deltaX * unit), Math.round(-e.deltaY * unit))]);
  }, { passive: false });
  v.win.addEventListener("resize", () => pointer.draw());
  video.addEventListener("resize", () => pointer.draw());
  acceptDrops(v);
}

// Files dropped on a window of the page: offered on the guest clipboard, for a paste there. A
// browser gives a page the files dropped on it, not those of the local clipboard. Whatever is
// dropped, the browser must not open it in place of the session.
function acceptDrops(v) {
  const doc = v.win.document;
  const files = (e) => e.dataTransfer?.types.includes("Files");
  let over = 0;
  const shown = (on) => { if (v.screen === 0) $("drop").hidden = !on; };
  doc.addEventListener("dragenter", (e) => {
    if (!files(e)) return;
    e.preventDefault();
    if (++over === 1) shown(!shadow && !card.shown());
  });
  doc.addEventListener("dragover", (e) => {
    if (!files(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = shadow || card.shown() ? "none" : "copy";
  });
  doc.addEventListener("dragleave", (e) => {
    if (files(e) && --over <= 0) { over = 0; shown(false); }
  });
  doc.addEventListener("drop", (e) => {
    if (!files(e)) return;
    e.preventDefault();
    over = 0;
    shown(false);
    if (shadow || card.shown()) return;
    droppedFiles(e.dataTransfer).then((list) => {
      const count = list.filter((f) => !f.directory).length;
      if (list.length === 0) { toast.show(T.filesNone); return; }
      clip.offerFiles(list);
      toast.show(T.filesReady(count || list.length), 6000);
    }).catch((err) => console.warn("drop:", err));
  });
}

// What was dropped, as the clipboard's file list: each file and directory with its path within
// the drop, a directory before what it holds. The entries must be taken during the drop event:
// the browser empties the DataTransfer after it.
function droppedFiles(dataTransfer) {
  const entries = [...dataTransfer.items].filter((i) => i.kind === "file")
    .map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  const plain = [...dataTransfer.files];
  return (async () => {
    const out = [];
    if (entries.length === 0) {
      for (const file of plain) out.push({ path: file.name, directory: false, size: file.size, modified: file.lastModified, file });
      return out;
    }
    const walk = async (entry, path) => {
      if (entry.isDirectory) {
        out.push({ path, directory: true, size: 0, modified: 0 });
        const reader = entry.createReader();
        // A directory's entries come in batches, until an empty one.
        for (;;) {
          const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
          if (batch.length === 0) break;
          for (const child of batch) await walk(child, `${path}/${child.name}`);
        }
      } else {
        const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
        out.push({ path, directory: false, size: file.size, modified: file.lastModified, file });
      }
    };
    for (const entry of entries) await walk(entry, entry.name);
    return out;
  })();
}

// The pixel of the guest screen under the pointer, the video being scaled to fit the window
// (object-fit: contain) with bars around it.
function guestPixel(e, v) {
  const w = v.video.videoWidth, h = v.video.videoHeight;
  if (!w || !h) return null;
  const r = v.video.getBoundingClientRect();
  const scale = Math.min(r.width / w, r.height / h);
  const x = (e.clientX - r.left - (r.width - w * scale) / 2) / scale;
  const y = (e.clientY - r.top - (r.height - h * scale) / 2) / scale;
  return [Math.min(w - 1, Math.max(0, Math.floor(x))), Math.min(h - 1, Math.max(0, Math.floor(y)))];
}

// The guest screen and pixel under the pointer, [screen, x, y], for an event of `from`'s window.
// While a button is down, the browser sends the moves to the window the drag started in,
// wherever the pointer goes: over another of the page's windows, the pointer is on that one's
// screen, found by the windows' places on the desktop; elsewhere, on `from`'s edge. As the
// native client does (its `screens::locate`): a guest window dragged from one monitor to the
// next follows the pointer.
function locate(e, from) {
  const inside = (v, x, y) => x >= 0 && y >= 0 && x < v.win.innerWidth && y < v.win.innerHeight;
  if (views.length > 1 && !inside(from, e.clientX, e.clientY)) {
    for (const v of views) {
      if (v === from) continue;
      // The window's content on the desktop: its frame's place, less the borders and the title
      // bar (none in full screen).
      const w = v.win;
      const x = e.screenX - (w.screenX + (w.outerWidth - w.innerWidth) / 2);
      const y = e.screenY - (w.screenY + (w.outerHeight - w.innerHeight));
      if (inside(v, x, y)) {
        const p = guestPixel({ clientX: x, clientY: y }, v);
        return p && [v.screen, ...p];
      }
    }
  }
  const p = guestPixel(e, from);
  return p && [from.screen, ...p];
}

// Button: left = 1, middle = 2, right = 3, back = 4, forward = 5; DOM numbers them from 0.
const BUTTONS = [1, 2, 3, 4, 5];
// Client pixels to guest pixels, for relative moves: the guest's own scale on the page.
function guestScale(v) {
  const w = v.video.videoWidth, h = v.video.videoHeight, r = v.video.getBoundingClientRect();
  return w && h && r.width && r.height ? 1 / Math.min(r.width / w, r.height / h) : 1;
}

// The guest pointer. Absolute (the guest places it where the user points): drawn by the browser
// as its own cursor over each screen's video. Relative (the guest only takes moves: no tablet, no
// guest agent): this page holds the system pointer (Pointer Lock) once the user clicks the
// screen, sends its moves, and draws the guest pointer where the guest puts it.
// PointerUpdate: shape = 1, visible = 2, screen = 3, position = 4; PointerShape: width, height,
// hot_x, hot_y, rgba; PointerPosition: x, y.
const hint = document.getElementById("hint");
const pointer = {
  relative: false,
  // Forget the guest pointer of a connection that ended.
  reset() {
    for (const v of views) Object.assign(v, { css: "default", image: "", hot: [0, 0], visible: true, position: null });
    if (this.locked()) document.exitPointerLock();
    this.relative = false;
    this.draw();
  },
  locked: () => document.pointerLockElement === video,
  setRelative(relative) {
    this.relative = relative;
    if (!relative && this.locked()) document.exitPointerLock();
    this.draw();
  },
  draw() {
    // A shadow client only watches: it sees the guest pointer, and takes none.
    hint.hidden = !this.relative || this.locked() || !input.channel || shadow || card.shown();
    views.forEach((v) => this.drawOn(v));
  },
  // The guest pixel (x, y) on the window, the video being scaled to fit (object-fit: contain).
  drawOn(v) {
    v.video.style.cursor = this.relative ? "default" : v.visible ? v.css : "none";
    const w = v.video.videoWidth, h = v.video.videoHeight;
    if (!this.relative || !v.visible || !v.position || !v.image || !w || !h) {
      v.cursor.style.display = "none";
      return;
    }
    const r = v.video.getBoundingClientRect();
    const scale = Math.min(r.width / w, r.height / h);
    const [x, y] = v.position;
    v.cursor.src = v.image;
    v.cursor.style.left = `${r.left + (r.width - w * scale) / 2 + x * scale - v.hot[0]}px`;
    v.cursor.style.top = `${r.top + (r.height - h * scale) / 2 + y * scale - v.hot[1]}px`;
    v.cursor.style.display = "block";
  },
};
function pointerUpdate(bytes) {
  const update = pb.parse(bytes);
  // The screens shown here only.
  const v = views[uint(update, 3)];
  if (!v) return;
  if (update.has(1)) {
    const s = pb.parse(update.get(1)[0]);
    const [w, h] = [uint(s, 1), uint(s, 2)];
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    if (w && h) canvas.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(s.get(5)[0]), w, h), 0, 0);
    v.image = canvas.toDataURL();
    v.hot = [uint(s, 3), uint(s, 4)];
    v.css = `url(${v.image}) ${v.hot[0]} ${v.hot[1]}, default`;
  }
  if (update.has(2)) v.visible = update.get(2)[0] !== 0;
  if (update.has(4)) {
    const p = pb.parse(update.get(4)[0]);
    v.position = [uint(p, 1), uint(p, 2)];
  }
  pointer.draw();
}
document.addEventListener("pointerlockchange", () => {
  // The guest keeps no button pressed that the page no longer sees released.
  if (!pointer.locked()) input.releaseAll();
  pointer.draw();
});
listen(views[0]);

// ---------------------------------------------------------------------------------------------
// Clipboard, modelled on RDP: whoever copied last owns it, and the data move when someone
// pastes. A page cannot watch the local clipboard: it reads it when it gets the focus, and
// offers it to the guest if it changed. What the guest copies is written to the local
// clipboard at once, or when the page gets the focus back. Browsers give the clipboard to
// pages in HTTPS (or from localhost) only.
// ClipboardMessage: grab = 1, release = 2, request = 3, data = 4.

// CHUNK: MAX_CHUNK of qdw-protocol, so that a whole message fits in 64 KiB.
const TEXT = "text/plain;charset=utf-8", PNG = "image/png", CHUNK = 60 * 1024;
// Files and directories (FILE_LIST_MIME of qdw-protocol): the data is a ClipboardFileList.
const FILES = "application/vnd.qdw.file-list";
const clip = {
  channel: null,
  guest: [],             // the types the guest clipboard holds
  guestPending: false,   // the guest copied while the page had no focus
  local: {},             // what this client copied, offered to the guest: { text, png, files }
  locked: new Map(),     // clip_data_id -> the files the guest locked, readable until unlocked
  written: {},           // what the page last wrote to the local clipboard, or offered
  answers: new Map(),    // request id -> chunks received
  nextId: 1,
  send(build) {
    if (this.channel?.readyState === "open") this.channel.send(new Uint8Array(pb.message(build)));
  },
  // Send, once the channel's buffer is low: a file's pieces would otherwise pile up in it, and a
  // browser closes a channel whose buffer overflows.
  async sendPaced(build) {
    const channel = this.channel;
    if (channel?.readyState !== "open") return;
    if (channel.bufferedAmount > 1024 * 1024) {
      channel.bufferedAmountLowThreshold = 256 * 1024;
      await new Promise((resolve) => channel.addEventListener("bufferedamountlow", resolve, { once: true }));
    }
    if (channel === this.channel && channel.readyState === "open") channel.send(new Uint8Array(pb.message(build)));
  },
  // Offer files to the guest, from a drop: its clipboard holds them, and a paste in the guest
  // copies them there. `files`: [{ path, directory, size, modified, file }], a directory before
  // what it holds.
  offerFiles(files) {
    if (files.length === 0) return;
    this.local = { files };
    this.send((o) => pb.bytes(o, 1, pb.message((g) => pb.string(g, 1, FILES))));
  },
  // ClipboardFileList: files = 1; ClipboardFile: path = 1, directory = 2, size = 3,
  // modified_ms = 4.
  fileList(files) {
    return new Uint8Array(pb.message((l) => files.forEach((f) => pb.bytes(l, 1, pb.message((m) => {
      pb.string(m, 1, f.path);
      if (f.directory) pb.uint(m, 2, 1);
      if (f.size) pb.uint(m, 3, f.size);
      if (f.modified > 0) pb.uint(m, 4, f.modified);
    })))));
  },
  // The guest reads a dropped file: its size, or a piece. ClipboardFileRequest: id = 1, index = 2,
  // size = 3, offset = 4, length = 5, clip_data_id = 6; ClipboardFileData: id = 1, size = 2,
  // data = 3, last = 4, failed = 5.
  async fileRequest(r) {
    const id = uint(r, 1);
    const files = r.has(6) ? this.locked.get(uint(r, 6)) : this.local.files;
    const f = files?.[uint(r, 2)];
    const reply = (build) => this.sendPaced((o) => pb.bytes(o, 8, pb.message((d) => { pb.uint(d, 1, id); build(d); })));
    if (!f || f.directory) return reply((d) => { pb.uint(d, 4, 1); pb.uint(d, 5, 1); });
    if (uint(r, 3)) return reply((d) => { pb.uint(d, 2, f.size); pb.uint(d, 4, 1); });
    const offset = uint(r, 4);
    let bytes;
    try {
      bytes = new Uint8Array(await f.file.slice(offset, offset + uint(r, 5)).arrayBuffer());
    } catch (e) {
      // The file went, or changed, since the drop.
      console.warn("dropped file", f.path, e);
      return reply((d) => { pb.uint(d, 4, 1); pb.uint(d, 5, 1); });
    }
    let at = 0;
    do {
      const chunk = bytes.subarray(at, at + CHUNK);
      at += CHUNK;
      const last = at >= bytes.length;
      await reply((d) => { pb.bytes(d, 3, chunk); if (last) pb.uint(d, 4, 1); });
    } while (at < bytes.length);
  },
  // One of the page's windows has the focus: offer what was copied locally, or take what the
  // guest copied.
  async focused() {
    if (!window.isSecureContext || !focusedWindow()) return;
    if (!(await this.readLocal()) && this.guestPending) this.fetchGuest();
  },
  // Offer the local clipboard to the guest if it changed. True if it did.
  async readLocal() {
    let text, png;
    try {
      for (const item of await focusedWindow().navigator.clipboard.read()) {
        if (item.types.includes("text/plain")) text = await (await item.getType("text/plain")).text();
        if (item.types.includes("image/png")) png = await item.getType("image/png");
      }
    } catch { return false; }   // no permission, or nothing readable
    const same = text === this.written.text && png?.size === this.written.png?.size;
    if (same || (text === undefined && png === undefined)) return false;
    this.local = { text, png };
    this.written = { text, png };
    const mimes = [...(text !== undefined ? [TEXT] : []), ...(png ? [PNG] : [])];
    this.send((o) => pb.bytes(o, 1, pb.message((g) => mimes.forEach((m) => pb.string(g, 1, m)))));
    return true;
  },
  // Ask the guest for its clipboard, text first.
  fetchGuest() {
    this.guestPending = false;
    const mime = this.guest.includes(TEXT) ? TEXT : this.guest.includes(PNG) ? PNG : null;
    if (!mime) return;
    const id = this.nextId++;
    this.answers.set(id, []);
    this.send((o) => pb.bytes(o, 3, pb.message((r) => { pb.uint(r, 1, id); pb.string(r, 2, mime); })));
  },
  // Answer the guest's paste of what this client copied, in chunks.
  answer(id, mimes) {
    const send = (mime, bytes) => {
      let offset = 0;
      do {
        const chunk = bytes.subarray(offset, offset + CHUNK);
        offset += CHUNK;
        const last = offset >= bytes.length;
        this.send((o) => pb.bytes(o, 4, pb.message((d) => {
          pb.uint(d, 1, id); pb.string(d, 2, mime); pb.bytes(d, 3, chunk); pb.uint(d, 4, last ? 1 : 0);
        })));
      } while (offset < bytes.length);
    };
    if (mimes.includes(FILES) && this.local.files) return send(FILES, this.fileList(this.local.files));
    if (mimes.includes(TEXT) && this.local.text !== undefined) return send(TEXT, pb.utf8.encode(this.local.text));
    if (mimes.includes(PNG) && this.local.png) {
      return this.local.png.arrayBuffer().then((b) => send(PNG, new Uint8Array(b)));
    }
    send("", new Uint8Array());
  },
};

async function clipboardMessage(bytes) {
  const message = pb.parse(bytes);
  // ClipboardLock, ClipboardUnlock: clip_data_id = 1.
  if (message.has(5)) {
    if (clip.local.files) clip.locked.set(uint(pb.parse(message.get(5)[0]), 1), clip.local.files);
  } else if (message.has(6)) {
    clip.locked.delete(uint(pb.parse(message.get(6)[0]), 1));
  } else if (message.has(7)) {
    await clip.fileRequest(pb.parse(message.get(7)[0]));
  } else if (message.has(1)) {
    clip.guest = (pb.parse(message.get(1)[0]).get(1) || []).map((m) => pb.text.decode(m));
    if (focusedWindow()) clip.fetchGuest(); else clip.guestPending = true;
  } else if (message.has(2)) {
    clip.guest = [];
    clip.guestPending = false;
  } else if (message.has(3)) {
    const r = pb.parse(message.get(3)[0]);
    clip.answer(uint(r, 1), (r.get(2) || []).map((m) => pb.text.decode(m)));
  } else if (message.has(4)) {
    const d = pb.parse(message.get(4)[0]);
    const id = uint(d, 1), chunks = clip.answers.get(id);
    if (!chunks) return;
    chunks.push(d.get(3)?.[0] || new Uint8Array());
    if (!uint(d, 4)) return;
    clip.answers.delete(id);
    const mime = str(d, 2), data = new Blob(chunks);
    const win = focusedWindow() || window;
    try {
      if (mime === TEXT) {
        const text = await data.text();
        clip.written = { text };
        await win.navigator.clipboard.writeText(text);
      } else if (mime === PNG) {
        const png = new Blob([data], { type: PNG });
        clip.written = { png };
        await win.navigator.clipboard.write([new win.ClipboardItem({ [PNG]: png })]);
      }
    } catch { clip.guestPending = true; }   // no focus or no permission: try again later
  }
}
// The window of the page's that has the focus, if any: browsers let it alone use the clipboard.
const focusedWindow = () => views.find((v) => v.win.document.hasFocus())?.win;
window.addEventListener("focus", () => clip.focused());

// The microphone, as the guest wants it: the button allows it (browsers want a click and a
// permission), and the microphone then opens only while an application in the guest records
// (the server says so on the control channel), sent on the sound's track; the browser shows it
// in use only then. A second click disallows it.
const micButton = $("mic");
if (shadow) micButton.hidden = true;
const mic = {
  allowed: false,
  // Whether the guest records.
  wanted: false,
  track: null,
  // Opening and closing, one after the other.
  queue: Promise.resolve(),
  apply() {
    this.queue = this.queue.then(() => this.update());
  },
  async update() {
    const sender = pc?.getTransceivers().find((t) => t.receiver.track.kind === "audio")?.sender;
    if (this.allowed && this.wanted && !this.track && sender) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        this.track = stream.getAudioTracks()[0];
        await sender.replaceTrack(this.track);
      } catch (e) {
        console.error("microphone", e);
        this.refused(e);
      }
    } else if (!(this.allowed && this.wanted) && this.track) {
      this.track.stop();
      this.track = null;
      if (sender) await sender.replaceTrack(null);
    }
    this.label();
  },
  refused(e) {
    // NotAllowedError: refused, or blocked for this site (the address bar shows it).
    this.allowed = false;
    toast.show(e.name === "NotAllowedError" ? T.micBlocked : T.micError(e.message));
  },
  // The connection ended: the microphone closes; allowed, it opens again on the next when the
  // guest records.
  reset() {
    this.track?.stop();
    this.track = null;
    this.wanted = false;
    this.label();
  },
  label() {
    micButton.classList.toggle("off", !this.allowed);
    micButton.classList.toggle("on", this.allowed && !this.track);
    micButton.classList.toggle("live", !!this.track);
    tip("mic", !this.allowed ? T.micOff : this.track ? T.micOn : T.micReady);
  },
};
mic.label();
micButton.addEventListener("click", () => {
  if (!navigator.mediaDevices) {
    toast.show(T.micHttps);
    return;
  }
  mic.allowed = !mic.allowed;
  if (mic.allowed && !mic.wanted) {

    full.addEventListener("click", () => {
      full.blur();
      goFull().catch((e) => console.warn("full screen:", e));
    });
    doc.addEventListener("fullscreenchange", () => { full.hidden = !!doc.fullscreenElement; });
    doc.body.append(videoElement, cursorElement, full);
    videoElement.srcObject = new MediaStream([this.transceivers[i].receiver.track]);
    videoElement.play().catch(() => {});
    win.addEventListener("focus", () => clip.focused());
    const v = view(i, win, videoElement, cursorElement);
    views.push(v);
    listen(v);
    pointer.draw();
    goFull().catch((e) => console.info(`screen ${i + 1}: full screen on a click (${e.name})`));
    return true;
  },
  stop() {
    if (!this.monitors) return;
    this.monitors = null;
    clearInterval(this.poll);
    for (const v of views.splice(1)) if (!v.win.closed) v.win.close();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    navigator.keyboard?.unlock?.();
    input.releaseAll();
    control.layout();
    control.videoPause();
    this.label();
  },
  label() {
    screensButton.classList.toggle("on", !!this.monitors);
    tip("screens", !this.monitors ? T.screensStart
      : views.length < this.order.length ? T.screensOpen(views.length + 1) : T.screensStop);
  },
};
// The monitors' layout in device pixels, the first at 0, 0. With one scale on all, their places
// on the desktop; with different scales the browser's coordinates mix units, so the monitors go
// side by side, left to right, tops aligned.
function monitorsOf(order) {
  const size = (m) => ({
    width: Math.round(m.width * m.devicePixelRatio),
    height: Math.round(m.height * m.devicePixelRatio),
  });
  const scale = order[0].devicePixelRatio;
  if (order.every((m) => m.devicePixelRatio === scale)) {
    return order.map((m) => ({
      x: Math.round((m.left - order[0].left) * scale),
      y: Math.round((m.top - order[0].top) * scale),
      ...size(m),
    }));
  }
  const x = new Map();
  let at = 0;
  for (const m of [...order].sort((a, b) => a.left - b.left)) {
    x.set(m, at);
    at += size(m).width;
  }
  return order.map((m) => ({ x: x.get(m) - x.get(order[0]), y: 0, ...size(m) }));
}
screensButton.addEventListener("click", () => {
  if (screens.monitors && views.length >= screens.order.length) screens.stop();
  else screens.start();
});

// ---------------------------------------------------------------------------------------------
// The other tools: full screen, Ctrl+Alt+Del, the details, leaving.

// Full screen for this window; while in it, every key goes to the guest: holding Esc leaves.
$("fullscreen").addEventListener("click", () => {
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
    return;
  }
  document.documentElement.requestFullscreen()
    .then(() => navigator.keyboard?.lock?.())
    .then(() => { if (navigator.keyboard?.lock) toast.show(T.fullScreenHold); })
    .catch((e) => console.warn("full screen:", e));
});
document.addEventListener("fullscreenchange", () => {
  const full = !!document.fullscreenElement;
  $("fullscreen-path").setAttribute("d", full
    ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
  tip("fullscreen", full ? T.fullScreenExit : T.fullScreen);
  if (!full) {
    navigator.keyboard?.unlock?.();
    screens.stop();
  }
});

// Ctrl+Alt+Del, which the local system keeps for itself: pressed and released in the guest.
$("cad").addEventListener("click", () => {
  const keys = [0x1d, 0x38, 0xe053];
  input.send([...keys.map((k) => ev.key(k, true)), ...keys.reverse().map((k) => ev.key(k, false))]);
  toast.show(T.cadSent, 1800);
});
for (const id of ["cad"]) if (shadow) $(id).hidden = true;
$("watching").hidden = !shadow;

const panel = {
  toggle(open = $("panel").hidden) {
    $("panel").hidden = !open;
    $("details").classList.toggle("on", open);
    if (open) { bar.show(); quality.sample().catch(() => {}); } else bar.hide();
  },
};
$("details").addEventListener("click", () => panel.toggle());
$("panel-close").addEventListener("click", () => panel.toggle(false));
$("leave").addEventListener("click", () => {
  panel.toggle(false);
  session.leave();
});

session.connect();
</script>
