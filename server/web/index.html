<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qemu-dbus-webrtc</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #stats { position: fixed; top: 8px; left: 8px; padding: 6px 10px; background: rgba(0, 0, 0, .65);
           border-radius: 4px; white-space: pre; font-family: ui-monospace, monospace; pointer-events: none; }
  #stats.error { background: #8b1a1a; }
  #mic { position: fixed; top: 8px; right: 8px; padding: 6px 10px; border: 0; border-radius: 4px;
         background: rgba(0, 0, 0, .65); color: #eee; font: inherit; cursor: pointer; }
  #mic.on, #cam.on { background: #1a6b2e; }
  #cam { position: fixed; top: 8px; right: 84px; padding: 6px 10px; border: 0; border-radius: 4px;
         background: rgba(0, 0, 0, .65); color: #eee; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div id="stats">connecting…</div>
<button id="mic" type="button" title="Send this computer's microphone to the guest">Mic off</button>
<button id="cam" type="button" title="Show this computer's camera in the guest">Cam off</button>
<script>
"use strict";
const video = document.getElementById("video");
const stats = document.getElementById("stats");

function fail(message) {
  stats.textContent = message;
  stats.className = "error";
}

// Protocol Buffers, just what the messages of crates/protocol/proto/qdw.proto need:
// varints and length-delimited fields (strings, nested messages).
const pb = {
  utf8: new TextEncoder(),
  text: new TextDecoder(),
  varint(out, n) {
    while (n > 0x7f) { out.push((n & 0x7f) | 0x80); n = Math.floor(n / 128); }
    out.push(n);
  },
  bytes(out, field, bytes) { pb.varint(out, (field << 3) | 2); pb.varint(out, bytes.length); for (const b of bytes) out.push(b); },
  string(out, field, s) { pb.bytes(out, field, pb.utf8.encode(s)); },
  uint(out, field, n) { pb.varint(out, field << 3); pb.varint(out, n); },
  // int32: a negative value is sent as its 64-bit two's complement.
  int(out, field, n) {
    pb.varint(out, field << 3);
    let v = BigInt.asUintN(64, BigInt(n));
    while (v > 0x7fn) { out.push(Number(v & 0x7fn) | 0x80); v >>= 7n; }
    out.push(Number(v));
  },
  message(build) { const out = []; build(out); return out; },
  // The fields of a message: field number -> list of values (numbers, or byte arrays).
  parse(bytes) {
    const fields = new Map();
    let i = 0;
    const varint = () => { let n = 0, shift = 1, b; do { b = bytes[i++]; n += (b & 0x7f) * shift; shift *= 128; } while (b & 0x80); return n; };
    while (i < bytes.length) {
      const key = varint(), field = Math.floor(key / 8), wire = key & 7;
      let value;
      if (wire === 0) value = varint();
      else if (wire === 2) { const n = varint(); value = bytes.subarray(i, i + n); i += n; }
      else if (wire === 1) { i += 8; continue; }
      else if (wire === 5) { i += 4; continue; }
      else throw new Error(`wire type ${wire}`);
      if (!fields.has(field)) fields.set(field, []);
      fields.get(field).push(value);
    }
    return fields;
  },
};
const str = (fields, n) => pb.text.decode(fields.get(n)?.[0] || new Uint8Array());
const uint = (fields, n) => fields.get(n)?.[0] || 0;

// ClientMessage: hello = 1, answer = 2, ice = 3.
// Hello: codecs = 1, shadow = 2. With ?shadow in the address, the page only watches.
const shadow = new URLSearchParams(location.search).has("shadow");
const hello = (codecs) => pb.message((o) => pb.bytes(o, 1, pb.message((h) => {
  codecs.forEach((c) => pb.string(h, 1, c));
  if (shadow) pb.uint(h, 2, 1);
})));
const answer = (sdp) => pb.message((o) => pb.bytes(o, 2, pb.message((d) => pb.string(d, 1, sdp))));
const ice = (candidate, mline) => pb.message((o) => pb.bytes(o, 3, pb.message((c) => { pb.string(c, 1, candidate); pb.uint(c, 2, mline); })));

const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
ws.binaryType = "arraybuffer";
const pc = new RTCPeerConnection();
const send = (bytes) => ws.send(new Uint8Array(bytes));

// The video and the sound play in one element. Browsers play sound only after the user did
// something on the page: the element starts muted, and the first click or key unmutes it.
const media = new MediaStream();
pc.ontrack = (event) => {
  // The screen and the sound; the camera tracks only go the other way.
  const screen = pc.getTransceivers().find((t) => t.receiver.track.kind === "video");
  if (event.track.kind === "video" && event.transceiver !== screen) return;
  media.addTrack(event.track);
  if (video.srcObject !== media) video.srcObject = media;
  // Firefox stops playing when a track joins the stream: play again (nothing in Chrome).
  video.play().catch(() => {});
};
const unmute = () => { video.muted = false; };
window.addEventListener("pointerdown", unmute, { once: true });
window.addEventListener("keydown", unmute, { once: true });
// Every data channel, by its label: those the page uses, and the others, for debugging.
const channels = {};
pc.ondatachannel = ({ channel }) => {
  channels[channel.label] = channel;
  channel.binaryType = "arraybuffer";
  if (channel.label === "input") input.channel = channel;
  if (channel.label === "pointer") channel.onmessage = (event) => pointerUpdate(new Uint8Array(event.data));
  if (channel.label === "camera") {
    camera.channel = channel;
    channel.onmessage = (event) => cameraMessage(new Uint8Array(event.data));
  }
  if (channel.label === "control") {
    control.channel = channel;
    channel.onopen = () => { control.videoPause(); control.layout(); };
    // ControlMessage: bandwidth_estimate = 3; BandwidthEstimate: kbps = 1.
    channel.onmessage = (event) => {
      const message = pb.parse(new Uint8Array(event.data));
      if (message.has(3)) control.estimate = uint(pb.parse(message.get(3)[0]), 1);
    };
  }
  if (channel.label === "clipboard") {
    clip.channel = channel;
    channel.onmessage = (event) => clipboardMessage(new Uint8Array(event.data));
    channel.onopen = () => clip.focused();
  }
};
pc.onicecandidate = (event) => {
  if (event.candidate) send(ice(event.candidate.candidate, event.candidate.sdpMLineIndex || 0));
};
pc.onconnectionstatechange = () => {
  if (pc.connectionState === "failed") fail("connection failed");
};

ws.onopen = () => {
  // Tell the server which video codecs this browser decodes.
  // Each with its parameters ("video/VP9;profile-id=1"): the server checks the profile too.
  const codecs = (RTCRtpReceiver.getCapabilities("video")?.codecs || [])
    .map((c) => c.mimeType + (c.sdpFmtpLine ? `;${c.sdpFmtpLine}` : ""));
  send(hello([...new Set(codecs)]));
};
ws.onclose = () => { if (pc.connectionState !== "failed") fail("disconnected"); };
// ServerMessage: offer = 1, ice = 2, error = 3.
ws.onmessage = async (event) => {
  const message = pb.parse(new Uint8Array(event.data));
  if (message.has(1)) {
    await pc.setRemoteDescription({ type: "offer", sdp: str(pb.parse(message.get(1)[0]), 1) });
    // Sound both ways: the microphone can then go on the sound's track without renegotiating.
    for (const t of pc.getTransceivers()) if (t.receiver.track.kind === "audio") t.direction = "sendrecv";
    // The video tracks after the screen's carry the cameras, from here: sending, with no track
    // until the guest opens a camera.
    const videos = pc.getTransceivers().filter((t) => t.receiver.track.kind === "video");
    for (const t of videos.slice(1)) t.direction = "sendonly";
    await pc.setLocalDescription(await pc.createAnswer());
    send(answer(pc.localDescription.sdp));
  } else if (message.has(2)) {
    const c = pb.parse(message.get(2)[0]);
    await pc.addIceCandidate({ candidate: str(c, 1), sdpMLineIndex: uint(c, 2) });
  } else if (message.has(3)) {
    fail(str(pb.parse(message.get(3)[0]), 1));
  }
};

// ---------------------------------------------------------------------------------------------
// Keyboard and pointer, modelled on RDP: keys by position (the guest applies its own layout),
// lock keys synchronised on focus, everything released when the focus goes.

// KeyboardEvent.code -> PC scancode, set 1. 0xE000 marks the E0 prefix; Pause is apart.
const SCANCODES = {
  Escape: 0x01, Digit1: 0x02, Digit2: 0x03, Digit3: 0x04, Digit4: 0x05, Digit5: 0x06, Digit6: 0x07,
  Digit7: 0x08, Digit8: 0x09, Digit9: 0x0a, Digit0: 0x0b, Minus: 0x0c, Equal: 0x0d, Backspace: 0x0e,
  Tab: 0x0f, KeyQ: 0x10, KeyW: 0x11, KeyE: 0x12, KeyR: 0x13, KeyT: 0x14, KeyY: 0x15, KeyU: 0x16,
  KeyI: 0x17, KeyO: 0x18, KeyP: 0x19, BracketLeft: 0x1a, BracketRight: 0x1b, Enter: 0x1c,
  ControlLeft: 0x1d, KeyA: 0x1e, KeyS: 0x1f, KeyD: 0x20, KeyF: 0x21, KeyG: 0x22, KeyH: 0x23,
  KeyJ: 0x24, KeyK: 0x25, KeyL: 0x26, Semicolon: 0x27, Quote: 0x28, Backquote: 0x29,
  ShiftLeft: 0x2a, Backslash: 0x2b, KeyZ: 0x2c, KeyX: 0x2d, KeyC: 0x2e, KeyV: 0x2f, KeyB: 0x30,
  KeyN: 0x31, KeyM: 0x32, Comma: 0x33, Period: 0x34, Slash: 0x35, ShiftRight: 0x36,
  NumpadMultiply: 0x37, AltLeft: 0x38, Space: 0x39, CapsLock: 0x3a, F1: 0x3b, F2: 0x3c, F3: 0x3d,
  F4: 0x3e, F5: 0x3f, F6: 0x40, F7: 0x41, F8: 0x42, F9: 0x43, F10: 0x44, NumLock: 0x45,
  ScrollLock: 0x46, Numpad7: 0x47, Numpad8: 0x48, Numpad9: 0x49, NumpadSubtract: 0x4a,
  Numpad4: 0x4b, Numpad5: 0x4c, Numpad6: 0x4d, NumpadAdd: 0x4e, Numpad1: 0x4f, Numpad2: 0x50,
  Numpad3: 0x51, Numpad0: 0x52, NumpadDecimal: 0x53, IntlBackslash: 0x56, F11: 0x57, F12: 0x58,
  NumpadEqual: 0x59, KanaMode: 0x70, IntlRo: 0x73, Convert: 0x79, NonConvert: 0x7b, IntlYen: 0x7d,
  NumpadComma: 0x7e,
  NumpadEnter: 0xe01c, ControlRight: 0xe01d, AudioVolumeMute: 0xe020, MediaPlayPause: 0xe022,
  MediaStop: 0xe024, AudioVolumeDown: 0xe02e, AudioVolumeUp: 0xe030, NumpadDivide: 0xe035,
  PrintScreen: 0xe037, AltRight: 0xe038, Home: 0xe047, ArrowUp: 0xe048, PageUp: 0xe049,
  ArrowLeft: 0xe04b, ArrowRight: 0xe04d, End: 0xe04f, ArrowDown: 0xe050, PageDown: 0xe051,
  Insert: 0xe052, Delete: 0xe053, MetaLeft: 0xe05b, MetaRight: 0xe05c, ContextMenu: 0xe05d,
  MediaTrackPrevious: 0xe010, MediaTrackNext: 0xe019,
};

// Input = 1 repeated InputEvent; InputEvent: key = 1, pointer_move = 2, pointer_button = 3,
// wheel = 4, lock_keys = 5.
const ev = {
  key: (scancode, down) => pb.message((e) => pb.bytes(e, 1, pb.message((k) => {
    if (scancode === "Pause") { pb.uint(k, 1, 0x1d); pb.uint(k, 3, 1); }
    else { pb.uint(k, 1, scancode & 0x7f); pb.uint(k, 2, scancode > 0xff ? 1 : 0); }
    pb.uint(k, 4, down ? 1 : 0);
  }))),
  move: (x, y) => pb.message((e) => pb.bytes(e, 2, pb.message((m) => { pb.uint(m, 1, 0); pb.uint(m, 2, x); pb.uint(m, 3, y); }))),
  button: (button, down) => pb.message((e) => pb.bytes(e, 3, pb.message((b) => { pb.uint(b, 1, button); pb.uint(b, 2, down ? 1 : 0); }))),
  wheel: (dx, dy) => pb.message((e) => pb.bytes(e, 4, pb.message((w) => { pb.int(w, 1, dx); pb.int(w, 2, dy); }))),
  locks: (e) => pb.message((o) => pb.bytes(o, 5, pb.message((l) => {
    pb.uint(l, 1, e.getModifierState("CapsLock") ? 1 : 0);
    pb.uint(l, 2, e.getModifierState("NumLock") ? 1 : 0);
    pb.uint(l, 3, e.getModifierState("ScrollLock") ? 1 : 0);
  }))),
};

const input = {
  channel: null,
  keys: new Set(),        // scancodes held down
  buttons: new Set(),     // buttons held down
  syncLocks: true,        // send the lock keys with the next event
  move: null,             // the latest pointer position, sent once per frame
  send(events) {
    if (this.channel?.readyState !== "open" || events.length === 0) return;
    this.channel.send(new Uint8Array(pb.message((o) => events.forEach((e) => pb.bytes(o, 1, e)))));
  },
  // The lock keys first, when the focus came back.
  withLocks(e, events) {
    if (this.syncLocks && e.getModifierState) { this.syncLocks = false; events.unshift(ev.locks(e)); }
    return events;
  },
  releaseAll() {
    const events = [];
    this.keys.forEach((k) => events.push(ev.key(k, false)));
    this.buttons.forEach((b) => events.push(ev.button(b, false)));
    this.keys.clear(); this.buttons.clear();
    this.send(events);
    this.syncLocks = true;
  },
};

window.addEventListener("keydown", (e) => {
  const scancode = e.code === "Pause" ? "Pause" : SCANCODES[e.code];
  if (scancode === undefined) return;
  e.preventDefault();
  input.keys.add(scancode);
  input.send(input.withLocks(e, [ev.key(scancode, true)]));
});
window.addEventListener("keyup", (e) => {
  const scancode = e.code === "Pause" ? "Pause" : SCANCODES[e.code];
  if (scancode === undefined) return;
  e.preventDefault();
  input.keys.delete(scancode);
  input.send([ev.key(scancode, false)]);
});
window.addEventListener("blur", () => input.releaseAll());
document.addEventListener("visibilitychange", () => { if (document.hidden) input.releaseAll(); });

// The pixel of the guest screen under the pointer, the video being scaled to fit the window
// (object-fit: contain) with bars around it.
function guestPixel(e) {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return null;
  const r = video.getBoundingClientRect();
  const scale = Math.min(r.width / w, r.height / h);
  const x = (e.clientX - r.left - (r.width - w * scale) / 2) / scale;
  const y = (e.clientY - r.top - (r.height - h * scale) / 2) / scale;
  return [Math.min(w - 1, Math.max(0, Math.floor(x))), Math.min(h - 1, Math.max(0, Math.floor(y)))];
}

// Button: left = 1, middle = 2, right = 3, back = 4, forward = 5; DOM numbers them from 0.
const BUTTONS = [1, 2, 3, 4, 5];
video.addEventListener("pointermove", (e) => {
  const p = guestPixel(e);
  if (!p) return;
  if (input.syncLocks) input.send(input.withLocks(e, []));
  if (!input.move) requestAnimationFrame(() => { const [x, y] = input.move; input.move = null; input.send([ev.move(x, y)]); });
  input.move = p;
});
video.addEventListener("pointerdown", (e) => {
  const button = BUTTONS[e.button], p = guestPixel(e);
  if (!button || !p) return;
  e.preventDefault();
  video.setPointerCapture(e.pointerId);
  input.buttons.add(button);
  input.send(input.withLocks(e, [ev.move(p[0], p[1]), ev.button(button, true)]));
});
video.addEventListener("pointerup", (e) => {
  const button = BUTTONS[e.button];
  if (!button) return;
  e.preventDefault();
  input.buttons.delete(button);
  input.send([ev.button(button, false)]);
});
video.addEventListener("contextmenu", (e) => e.preventDefault());
// Wheel in 1/120 of a notch, positive up and right. Browsers count a notch as about 100 pixels
// or 3 lines.
video.addEventListener("wheel", (e) => {
  e.preventDefault();
  const unit = e.deltaMode === 0 ? 1.2 : e.deltaMode === 1 ? 40 : 120;
  input.send([ev.wheel(Math.round(e.deltaX * unit), Math.round(-e.deltaY * unit))]);
}, { passive: false });

// The guest pointer, drawn by the browser as its own cursor over the video.
// PointerUpdate: shape = 1, visible = 2; PointerShape: width, height, hot_x, hot_y, rgba.
const pointer = { css: "default", visible: true };
function pointerUpdate(bytes) {
  const update = pb.parse(bytes);
  if (update.has(1)) {
    const s = pb.parse(update.get(1)[0]);
    const [w, h] = [uint(s, 1), uint(s, 2)];
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    if (w && h) canvas.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(s.get(5)[0]), w, h), 0, 0);
    pointer.css = `url(${canvas.toDataURL()}) ${uint(s, 3)} ${uint(s, 4)}, default`;
  }
  if (update.has(2)) pointer.visible = update.get(2)[0] !== 0;
  video.style.cursor = pointer.visible ? pointer.css : "none";
}

// ---------------------------------------------------------------------------------------------
// Clipboard, modelled on RDP: whoever copied last owns it, and the data move when someone
// pastes. A page cannot watch the local clipboard: it reads it when it gets the focus, and
// offers it to the guest if it changed. What the guest copies is written to the local
// clipboard at once, or when the page gets the focus back. Browsers give the clipboard to
// pages in HTTPS (or from localhost) only.
// ClipboardMessage: grab = 1, release = 2, request = 3, data = 4.

// CHUNK: MAX_CHUNK of qdw-protocol, so that a whole message fits in 64 KiB.
const TEXT = "text/plain;charset=utf-8", PNG = "image/png", CHUNK = 60 * 1024;
const clip = {
  channel: null,
  guest: [],             // the types the guest clipboard holds
  guestPending: false,   // the guest copied while the page had no focus
  local: {},             // what this client copied, offered to the guest: { text, png }
  written: {},           // what the page last wrote to the local clipboard, or offered
  answers: new Map(),    // request id -> chunks received
  nextId: 1,
  send(build) {
    if (this.channel?.readyState === "open") this.channel.send(new Uint8Array(pb.message(build)));
  },
  // The page has the focus: offer what was copied locally, or take what the guest copied.
  async focused() {
    if (!window.isSecureContext || !document.hasFocus()) return;
    if (!(await this.readLocal()) && this.guestPending) this.fetchGuest();
  },
  // Offer the local clipboard to the guest if it changed. True if it did.
  async readLocal() {
    let text, png;
    try {
      for (const item of await navigator.clipboard.read()) {
        if (item.types.includes("text/plain")) text = await (await item.getType("text/plain")).text();
        if (item.types.includes("image/png")) png = await item.getType("image/png");
      }
    } catch { return false; }   // no permission, or nothing readable
    const same = text === this.written.text && png?.size === this.written.png?.size;
    if (same || (text === undefined && png === undefined)) return false;
    this.local = { text, png };
    this.written = { text, png };
    const mimes = [...(text !== undefined ? [TEXT] : []), ...(png ? [PNG] : [])];
    this.send((o) => pb.bytes(o, 1, pb.message((g) => mimes.forEach((m) => pb.string(g, 1, m)))));
    return true;
  },
  // Ask the guest for its clipboard, text first.
  fetchGuest() {
    this.guestPending = false;
    const mime = this.guest.includes(TEXT) ? TEXT : this.guest.includes(PNG) ? PNG : null;
    if (!mime) return;
    const id = this.nextId++;
    this.answers.set(id, []);
    this.send((o) => pb.bytes(o, 3, pb.message((r) => { pb.uint(r, 1, id); pb.string(r, 2, mime); })));
  },
  // Answer the guest's paste of what this client copied, in chunks.
  answer(id, mimes) {
    const send = (mime, bytes) => {
      let offset = 0;
      do {
        const chunk = bytes.subarray(offset, offset + CHUNK);
        offset += CHUNK;
        const last = offset >= bytes.length;
        this.send((o) => pb.bytes(o, 4, pb.message((d) => {
          pb.uint(d, 1, id); pb.string(d, 2, mime); pb.bytes(d, 3, chunk); pb.uint(d, 4, last ? 1 : 0);
        })));
      } while (offset < bytes.length);
    };
    if (mimes.includes(TEXT) && this.local.text !== undefined) return send(TEXT, pb.utf8.encode(this.local.text));
    if (mimes.includes(PNG) && this.local.png) {
      return this.local.png.arrayBuffer().then((b) => send(PNG, new Uint8Array(b)));
    }
    send("", new Uint8Array());
  },
};

async function clipboardMessage(bytes) {
  const message = pb.parse(bytes);
  if (message.has(1)) {
    clip.guest = (pb.parse(message.get(1)[0]).get(1) || []).map((m) => pb.text.decode(m));
    if (document.hasFocus()) clip.fetchGuest(); else clip.guestPending = true;
  } else if (message.has(2)) {
    clip.guest = [];
    clip.guestPending = false;
  } else if (message.has(3)) {
    const r = pb.parse(message.get(3)[0]);
    clip.answer(uint(r, 1), (r.get(2) || []).map((m) => pb.text.decode(m)));
  } else if (message.has(4)) {
    const d = pb.parse(message.get(4)[0]);
    const id = uint(d, 1), chunks = clip.answers.get(id);
    if (!chunks) return;
    chunks.push(d.get(3)?.[0] || new Uint8Array());
    if (!uint(d, 4)) return;
    clip.answers.delete(id);
    const mime = str(d, 2), data = new Blob(chunks);
    try {
      if (mime === TEXT) {
        const text = await data.text();
        clip.written = { text };
        await navigator.clipboard.writeText(text);
      } else if (mime === PNG) {
        const png = new Blob([data], { type: PNG });
        clip.written = { png };
        await navigator.clipboard.write([new ClipboardItem({ [PNG]: png })]);
      }
    } catch { clip.guestPending = true; }   // no focus or no permission: try again later
  }
}
window.addEventListener("focus", () => clip.focused());

// The microphone, on demand: the button asks for it (browsers want a click and a permission)
// and sends it on the sound's track; a second click stops it.
const micButton = document.getElementById("mic");
if (shadow) micButton.hidden = true;
let micTrack = null;
micButton.addEventListener("click", async () => {
  const sender = pc.getTransceivers().find((t) => t.receiver.track.kind === "audio")?.sender;
  if (!sender || !navigator.mediaDevices) {
    micButton.textContent = !sender ? "Mic: not connected yet" : "Mic: needs HTTPS";
    return;
  }
  if (micTrack) {
    micTrack.stop();
    micTrack = null;
    await sender.replaceTrack(null);
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      micTrack = stream.getAudioTracks()[0];
      await sender.replaceTrack(micTrack);
    } catch (e) {
      // NotAllowedError: refused, or blocked for this site (the address bar shows it).
      micButton.textContent = e.name === "NotAllowedError" ? "Mic: blocked by the browser" : `Mic: ${e.message}`;
      console.error("microphone", e);
      micButton.blur();
      return;
    }
  }
  micButton.textContent = micTrack ? "Mic on" : "Mic off";
  micButton.classList.toggle("on", !!micTrack);
  micButton.blur();   // keys go to the guest, not to the button
});

// Video paused while the page is hidden (a tab in the background, a minimized window, or one
// covered whole): the server stops encoding and sending it, and sends a keyframe when the page
// shows again. The sound goes on. ControlMessage: video_pause = 1; VideoPause: paused = 1.
const control = {
  channel: null,
  // The server's estimate of the bandwidth to this page, in kbit/s.
  estimate: null,
  videoPause() {
    if (this.channel?.readyState !== "open") return;
    const paused = document.hidden;
    this.channel.send(new Uint8Array(pb.message((o) => pb.bytes(o, 1, pb.message((v) => pb.uint(v, 1, paused ? 1 : 0))))));
  },
};
document.addEventListener("visibilitychange", () => control.videoPause());

// The guest's screen at the size of the window, in device pixels, so that the video shows
// unscaled; the server waits for the size to settle. ControlMessage: monitor_layout = 2;
// MonitorLayout: monitors = 1; Monitor: width = 3, height = 4.
control.layout = function () {
  if (shadow || this.channel?.readyState !== "open") return;
  const width = Math.round(window.innerWidth * devicePixelRatio);
  const height = Math.round(window.innerHeight * devicePixelRatio);
  this.channel.send(new Uint8Array(pb.message((o) => pb.bytes(o, 2, pb.message((l) =>
    pb.bytes(l, 1, pb.message((m) => { pb.uint(m, 3, width); pb.uint(m, 4, height); })))))));
};
window.addEventListener("resize", () => control.layout());

// Once a second: what is decoded, and how well.
let last = null, lastAudio = null;
setInterval(async () => {
  if (stats.className === "error") return;
  const report = await pc.getStats();
  let inbound = null, audio = null;
  const codecs = new Map();
  report.forEach((s) => {
    if (s.type === "inbound-rtp" && s.kind === "video") inbound = s;
    if (s.type === "inbound-rtp" && s.kind === "audio") audio = s;
    if (s.type === "codec") codecs.set(s.id, s);
  });
  if (!inbound) { stats.textContent = `connection: ${pc.connectionState}`; return; }
  const codec = codecs.get(inbound.codecId);
  let kbps = 0;
  if (last) kbps = (8 * (inbound.bytesReceived - last.bytesReceived)) / (inbound.timestamp - last.timestamp);
  last = inbound;
  // The sound over the last second: the share of samples the browser made up for packets
  // late or lost, and how long its jitter buffer holds them.
  let sound = "sound    -";
  if (audio && lastAudio) {
    const samples = audio.totalSamplesReceived - lastAudio.totalSamplesReceived;
    const concealed = audio.concealedSamples - lastAudio.concealedSamples;
    const emitted = audio.jitterBufferEmittedCount - lastAudio.jitterBufferEmittedCount;
    const held = audio.jitterBufferDelay - lastAudio.jitterBufferDelay;
    sound = `sound    jitter ${((audio.jitter || 0) * 1000).toFixed(1)} ms, `
      + `concealed ${samples > 0 ? ((100 * concealed) / samples).toFixed(1) : "0.0"} %, `
      + `buffer ${emitted > 0 ? ((1000 * held) / emitted).toFixed(0) : "?"} ms, `
      + `lost ${audio.packetsLost || 0}`;
  }
  lastAudio = audio;
  stats.textContent = [
    `codec    ${codec ? codec.mimeType + (codec.sdpFmtpLine ? " " + codec.sdpFmtpLine : "") : "?"}`,
    `decoder  ${inbound.decoderImplementation || "?"}${inbound.powerEfficientDecoder ? " (hardware)" : ""}`,
    `size     ${inbound.frameWidth || 0}x${inbound.frameHeight || 0}`,
    `fps      ${(inbound.framesPerSecond || 0).toFixed(0)}`,
    `bitrate  ${kbps.toFixed(0)} kbit/s, estimate ${control.estimate ?? "?"} kbit/s`,
    `lost     ${inbound.packetsLost || 0} packets, ${inbound.pliCount || 0} PLI, ${inbound.freezeCount || 0} freezes`,
    `jitter   ${((inbound.jitter || 0) * 1000).toFixed(1)} ms`,
    sound,
  ].join("\n");
}, 1000);

// ---------------------------------------------------------------------------------------------
// The camera, on demand: the button shows it in the guest, which opens it only when an
// application uses it; it then goes as H.264 on the track the server names.
// CameraMessage: announce = 1, remove = 2, control_value = 3 (to the server); added = 4,
// start = 5, stop = 6, set_control = 7 (from the server).
const camButton = document.getElementById("cam");
if (shadow) camButton.hidden = true;
const camera = { channel: null, announced: false, formats: [], controls: [], track: null, sender: null };
// The browser's camera settings, as MS-RDPECAM numbers them: set 1 CameraControl, 2
// VideoProcAmp; `mode` is the setting that switches it to automatic.
const CAMERA_CONTROLS = [
  { set: 2, property: 2, key: "brightness" },
  { set: 2, property: 3, key: "contrast" },
  { set: 2, property: 5, key: "colorTemperature", mode: "whiteBalanceMode" },
  { set: 1, property: 1, key: "exposureTime", mode: "exposureMode" },
  { set: 1, property: 2, key: "focusDistance", mode: "focusMode" },
  { set: 1, property: 3, key: "pan" },
  { set: 1, property: 5, key: "tilt" },
  { set: 1, property: 6, key: "zoom" },
];
const camSend = (field, build) => {
  if (camera.channel?.readyState === "open") camera.channel.send(new Uint8Array(pb.message((o) => pb.bytes(o, field, pb.message(build)))));
};
// What the camera can do: the usual sizes it reaches, at up to 30 frames a second, and the
// settings the browser exposes, in integers (scaled when the browser's step is a fraction).
async function cameraProbe() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const settings = track.getSettings();
  const fps = Math.max(1, Math.min(30, Math.floor(caps.frameRate?.max || 30)));
  const sizes = [[3840, 2160], [1920, 1080], [1280, 720], [640, 480], [320, 240]]
    .filter(([w, h]) => w <= (caps.width?.max || settings.width) && h <= (caps.height?.max || settings.height));
  camera.formats = sizes.map(([width, height]) => ({ width, height, fps }));
  camera.controls = [];
  for (const c of CAMERA_CONTROLS) {
    const range = caps[c.key];
    if (!range || range.max === undefined) continue;
    const scale = range.step && range.step < 1 ? Math.min(1000, Math.round(1 / range.step)) : 1;
    const modes = c.mode ? caps[c.mode] || [] : [];
    camera.controls.push({ set: c.set, property: c.property, key: c.key, modeName: c.mode, scale,
      capabilities: 1 | (modes.includes("continuous") ? 2 : 0),
      min: Math.round(range.min * scale), max: Math.round(range.max * scale),
      step: Math.max(1, Math.round((range.step || 1) * scale)),
      value: Math.round((settings[c.key] ?? range.min) * scale),
      mode: c.mode && settings[c.mode] === "continuous" ? 2 : 1 });
  }
  const name = track.label || "Camera";
  track.stop();
  return name;
}
function cameraControlValue(c) {
  camSend(3, (v) => { pb.uint(v, 1, 1); pb.uint(v, 2, c.set); pb.uint(v, 3, c.property); pb.uint(v, 4, c.mode); pb.int(v, 5, c.value); });
}
// Apply a setting to the open camera; the value it took comes back in `c`.
async function cameraApply(c) {
  if (!camera.track) return;
  const constraint = c.mode === 2 && c.modeName ? { [c.modeName]: "continuous" }
    : { ...(c.modeName ? { [c.modeName]: "manual" } : {}), [c.key]: c.value / c.scale };
  try {
    await camera.track.applyConstraints({ advanced: [constraint] });
    const now = camera.track.getSettings()[c.key];
    if (now !== undefined) c.value = Math.round(now * c.scale);
  } catch (e) { console.warn("camera setting", c.key, e); }
}
async function cameraMessage(bytes) {
  const message = pb.parse(bytes);
  if (message.has(4)) {
    const added = pb.parse(message.get(4)[0]);
    const error = str(added, 2);
    camButton.title = error ? `Camera not shown: ${error}` : "The camera is shown in the guest";
    if (error) console.warn("camera not shown:", error);
  } else if (message.has(5)) {
    const start = pb.parse(message.get(5)[0]);
    const f = camera.formats[uint(start, 2)];
    const transceiver = pc.getTransceivers().find((t) => t.mid === str(start, 3));
    if (!f || !transceiver) return;
    // How long each step takes, in the console: from the server's start.
    const t0 = performance.now();
    const at = (step) => console.info(`camera: ${step} after ${Math.round(performance.now() - t0)} ms`);
    at(`start ${f.width}x${f.height}@${f.fps} on ${transceiver.mid}`);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: {
        width: { ideal: f.width }, height: { ideal: f.height }, frameRate: { ideal: f.fps } } });
      at("camera open");
      camera.track?.stop();
      camera.track = stream.getVideoTracks()[0];
      camera.sender = transceiver.sender;
      // The size the guest asked for, from the first frame: by default WebRTC sends smaller
      // pictures while its bandwidth estimate ramps up, which the guest's decoder, set for
      // the format, does not take (it asks for keyframes until the size is right).
      const parameters = camera.sender.getParameters();
      parameters.degradationPreference = "maintain-resolution";
      await camera.sender.setParameters(parameters).catch((e) => console.warn("camera parameters:", e));
      await camera.sender.replaceTrack(camera.track);
      at("track on the sender");
      (async () => {
        for (let i = 0; i < 300; i++) {
          let encoded = 0, sent = 0, size = "";
          (await camera.sender.getStats()).forEach((x) => {
            if (x.type === "outbound-rtp") {
              encoded = x.framesEncoded || 0; sent = x.keyFramesEncoded || 0;
              size = `${x.frameWidth}x${x.frameHeight}`;
            }
          });
          if (encoded > 0) { at(`first frame encoded, ${size} (${sent} keyframes)`); return; }
          await new Promise((r) => setTimeout(r, 50));
        }
        at("no frame encoded in 15 s");
      })();
      for (const c of camera.controls) await cameraApply(c);
      camButton.className = "on";
    } catch (e) { console.warn("camera:", e); }
  } else if (message.has(6)) {
    await camera.sender?.replaceTrack(null);
    camera.track?.stop();
    camera.track = null;
  } else if (message.has(7)) {
    const v = pb.parse(message.get(7)[0]);
    const c = camera.controls.find((c) => c.set === uint(v, 2) && c.property === uint(v, 3));
    if (!c) return;
    c.mode = uint(v, 4) || 1;
    if (c.mode === 1) c.value = uint(v, 5);
    await cameraApply(c);
    cameraControlValue(c);
  }
}
camButton.addEventListener("click", async () => {
  if (camera.announced) {
    camSend(2, (r) => pb.uint(r, 1, 1));
    await camera.sender?.replaceTrack(null);
    camera.track?.stop();
    camera.track = null;
    camera.announced = false;
    camButton.textContent = "Cam off";
    camButton.className = "";
    return;
  }
  try {
    const name = await cameraProbe();
    camSend(1, (a) => {
      pb.uint(a, 1, 1);
      pb.string(a, 2, name);
      for (const f of camera.formats) pb.bytes(a, 3, pb.message((m) => { pb.uint(m, 1, f.width); pb.uint(m, 2, f.height); pb.uint(m, 3, f.fps); pb.uint(m, 4, 1); }));
      for (const c of camera.controls) pb.bytes(a, 4, pb.message((m) => {
        pb.uint(m, 1, c.set); pb.uint(m, 2, c.property); pb.uint(m, 3, c.capabilities);
        pb.int(m, 4, c.min); pb.int(m, 5, c.max); pb.int(m, 6, c.step); pb.int(m, 7, c.value);
        pb.uint(m, 8, c.mode); pb.int(m, 9, c.value);
      }));
    });
    camera.announced = true;
    camButton.textContent = "Cam on";
  } catch (e) {
    camButton.title = `No camera: ${e.message}`;
    console.warn("camera:", e);
  }
});
</script>
</body>
</html>
