[package]
name = "qemu-dbus-webrtc"
description = "WebRTC console for QEMU virtual machines through QEMU's D-Bus display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The host's TPM, for its certificate to the broker: the TCG's stack (tpm2-tss), its Enhanced System API.
tss-esapi = "7.6"
reqwest.workspace = true
ciborium.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
hyper-util.workspace = true
tower.workspace = true
qdw-audio.workspace = true
qdw-protocol = { workspace = true, features = ["broker"] }
qdw-web.workspace = true
qdw-qemu.workspace = true
qdw-video.workspace = true
rustix = { workspace = true, features = ["fs"] }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
subtle.workspace = true
toml.workspace = true
anyhow.workspace = true
argon2.workspace = true
rpassword.workspace = true
base64.workspace = true
futures-util.workspace = true
serde_json.workspace = true
str0m.workspace = true
str0m-rust-crypto.workspace = true
if-addrs.workspace = true
instant-acme.workspace = true
x509-parser.workspace = true
zbus.workspace = true
axum.workspace = true
axum-server.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
# The broker's gRPC client: HTTP/2 on hyper, TLS with rustls and ring, the system's roots.
tonic = { workspace = true, features = ["codegen", "channel", "tls-ring", "tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# The broker's test: a broker served in TLS, locally.
tonic = { workspace = true, features = ["codegen", "channel", "router", "server", "tls-ring"] }
tokio-stream = { workspace = true, features = ["net"] }
# Time paused and advanced by hand, for the waits of the guest's consent.
tokio = { workspace = true, features = ["test-util"] }
# A WebSocket client, for the keepalive of the clients' WebSockets (as axum, no TLS).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
