# qemu-dbus-webrtc configuration: `qemu-dbus-webrtc --config <file>`, one per host, for instance
# /etc/qemu-dbus-webrtc/config.toml. Every setting is optional but the certificate; the command
# line's options override the file's.
#
# One server serves every VM of the host. A VM's page is https://<host>:<port>/vm/<uuid>/: the
# server attaches to the VM when its first client comes, and detaches when the last one left (a
# minute after a client cut off, which may come back).

[auth]
# Who may open the consoles: "password" (the default), the user and password below, checked
# before the server starts a VM or attaches to it; "none", anyone who reaches the server (a
# test). The password is an Argon2id hash, never in clear: `qemu-dbus-webrtc hash-password`.
method = "password"
user = "admin"
password = "$argon2id$v=19$m=19456,t=2,p=1$..."

[listen]
# The pages and their signalling. Default: 127.0.0.1:8090, this host only.
address = "0.0.0.0:8090"
# Required: the pages are served in HTTPS only (plain HTTP would carry the sessions in clear,
# and browsers give the microphone, the camera and the clipboard only in HTTPS). With [acme],
# where the certificate it gets goes (by default these).
certificate = "/etc/qemu-dbus-webrtc/tls/cert.pem"
key = "/etc/qemu-dbus-webrtc/tls/key.pem"

# The certificate from an ACME authority, public or the organization's own (step-ca, OpenBao,
# FreeIPA...), renewed once two thirds of its lifetime have gone and taken without a restart.
# An authorization the authority already holds as valid takes no challenge; otherwise HTTP-01,
# answered on `http` for the time of the validation (a private authority reaches servers on
# private addresses).
# [acme]
# directory = "https://ca.example.com/acme/acme/directory"
# domains = ["vdi.example.com"]
# contact = ["mailto:admin@example.com"]
# # External Account Binding, when the authority asks for it.
# eab_kid = "..."
# eab_hmac_key = "..."
# # The roots of a private authority's own HTTPS certificate.
# ca_bundle = "/etc/pki/ca-trust/source/anchors/internal-root.pem"
# # Where to answer HTTP-01. Default: 0.0.0.0:80.
# http = "0.0.0.0:80"
# # Where the account is kept. Default: /etc/qemu-dbus-webrtc/acme.
# dir = "/etc/qemu-dbus-webrtc/acme"

[video]
# How every VM is encoded.
# av1, vp9 or hevc (qemu-dbus-webrtc --codecs says what the GPUs encode). Default: av1, vp9 on
# the CPU.
codec = "hevc"
# 420 or 444 (VP9 and HEVC). Default: 420.
chroma = "444"
# Encode on the CPU (VP9), without a GPU. Default: false, and true when the host has no GPU
# encoder.
software = false
# Encode AV1 and HEVC on the GPU's own API (VA-API), without GStreamer's VA elements.
# Default: true; false goes back to them.
# direct = true
# Record each screen's stream to <prefix>-<vm uuid>-<console>.<extension>.
# record = "/var/tmp/qdw"

[bitrate]
# In kbit/s, for each client: the bandwidth estimation never goes below min, starts at start,
# and stays under max.
min = 4000
start = 10000
max = 30000

# Where the VMs are found: every VM manager enabled, then the VMs given by hand.

[libvirt]
# The domains with <graphics type='dbus'>. Default: enabled.
enabled = true
# Start a domain that is off when a client asks for it (through libvirt-dbus). Default: false;
# without authentication, anyone who reaches the server could start the host's VMs.
start = false
# Where libvirt puts their display's bus: read without libvirt-dbus, which then sees the
# running domains only.
# dir = "/run/libvirt/qemu/dbus"

[proxmox]
# The VMs of Proxmox VE, started with -display dbus,p2p=on (args: in their configuration).
# Default: disabled. Not tried yet.
enabled = false
# run_dir = "/var/run/qemu-server"
# conf_dir = "/etc/pve/qemu-server"

# A VM of no VM manager above, one of: qmp (its QMP socket, for -display dbus,p2p=on), dbus
# (the D-Bus bus on which QEMU owns org.qemu), or domain (a libvirt domain, by its name).
[[vm]]
qmp = "/run/qemu/vm.qmp"
