# qemu-dbus-webrtc configuration, one file per host: `qemu-dbus-webrtc --config <file>`, for
# example /etc/qemu-dbus-webrtc/config.toml. All settings are optional except the certificate;
# command-line options override this file.
#
# One server handles all VMs of the host. A VM's console is at https://<host>:<port>/vm/<uuid>/.
# The server attaches to a VM when its first client connects and detaches when the last one
# leaves (one minute after a lost connection, so that the client can reconnect).

[auth]
# Client authentication: "password" (default) checks the client's account, below, before the
# server starts or attaches to a VM; "none" lets anyone who can reach the server in (for testing
# only). Passwords are stored as Argon2id hashes, generated with `qemu-dbus-webrtc hash-password`.
method = "password"
# An account that may open every VM. Optional with [[account]] entries.
user = "admin"
password = "$argon2id$v=19$m=19456,t=2,p=1$..."

# Accounts, each with the VMs it may open: by UUID or name (libvirt domain, Proxmox VM ID or
# name), or "*" for all of them. A VM that no account names is open to none.
[[account]]
user = "alice"
password = "$argon2id$v=19$m=19456,t=2,p=1$..."
vms = ["win11-alice", "b8ff54ee-77f5-43dd-aa19-de8eaed5eb75"]

[listen]
# Address of the client page and signaling endpoint. Default: 127.0.0.1:8090 (local only).
address = "0.0.0.0:8090"
# Required: the server only serves HTTPS (plain HTTP would expose the sessions, and browsers
# require HTTPS for microphone, camera and clipboard access). With [acme], the paths where the
# obtained certificate is written (these by default).
certificate = "/etc/qemu-dbus-webrtc/tls/cert.pem"
key = "/etc/qemu-dbus-webrtc/tls/key.pem"

# Certificate from an ACME CA, public or private (step-ca, OpenBao, FreeIPA...), renewed after
# two thirds of its lifetime and reloaded without a restart. Authorizations the CA already holds
# as valid need no challenge; otherwise the server answers HTTP-01 challenges on `http` during
# validation (a private CA can reach servers on private addresses).
# [acme]
# directory = "https://ca.example.com/acme/acme/directory"
# domains = ["vdi.example.com"]
# contact = ["mailto:admin@example.com"]
# # External Account Binding, if the CA requires it.
# eab_kid = "..."
# eab_hmac_key = "..."
# # Root certificates of a private CA's own HTTPS endpoint.
# ca_bundle = "/etc/pki/ca-trust/source/anchors/internal-root.pem"
# # Address for HTTP-01 challenges. Default: 0.0.0.0:80.
# http = "0.0.0.0:80"
# # ACME account directory. Default: /etc/qemu-dbus-webrtc/acme.
# dir = "/etc/qemu-dbus-webrtc/acme"

[video]
# Video encoding, for all VMs.
# av1, vp9 or hevc (`qemu-dbus-webrtc --codecs` lists what the GPUs encode). Default: av1, or
# vp9 when encoding on the CPU.
codec = "hevc"
# Chroma subsampling: 420 or 444 (VP9 and HEVC only). Default: 420.
chroma = "444"
# Software encoding on the CPU (VP9). Default: false, or true when the host has no hardware
# encoder.
software = false
# Record each screen's stream to <prefix>-<vm uuid>-<console>.<extension>.
# record = "/var/tmp/qdw"

[bitrate]
# Bandwidth estimate bounds per client, in kbit/s: initial value and range.
min = 4000
start = 10000
max = 30000

# VM discovery: all enabled VM managers, plus the static VMs below.

[libvirt]
# libvirt domains with <graphics type='dbus'>. Default: enabled.
enabled = true
# Start a stopped domain when a client requests it (through libvirt-dbus). Default: false;
# without authentication, anyone who can reach the server could start the host's VMs.
start = false
# Directory of libvirt's display buses, used without libvirt-dbus (running domains only).
# dir = "/run/libvirt/qemu/dbus"

[proxmox]
# Proxmox VE VMs started with -display dbus,p2p=on (`args:` in their configuration).
# Default: disabled. Untested.
enabled = false
# run_dir = "/var/run/qemu-server"
# conf_dir = "/etc/pve/qemu-server"

# Static VMs, outside any VM manager above, each with one of: qmp (its QMP socket, for
# -display dbus,p2p=on), dbus (the D-Bus bus on which QEMU owns org.qemu), or domain (a libvirt
# domain name).
[[vm]]
qmp = "/run/qemu/vm.qmp"
