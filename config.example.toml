# qemu-dbus-webrtc configuration, one file per host: `qemu-dbus-webrtc --config <file>`, for
# example /etc/qemu-dbus-webrtc/config.toml. All settings are optional except the certificate;
# command-line options override this file.
#
# One server handles all VMs of the host. A VM's console is at https://<host>:<port>/vm/<uuid>/.
# The server attaches to a VM when its first client connects and detaches when the last one
# leaves (one minute after a lost connection, so that the client can reconnect).

[auth]
# Client authentication: "password" (default) checks the client's account, below, before the
# server starts or attaches to a VM; "none" lets anyone who can reach the server in (for testing
# only). Passwords are stored as Argon2id hashes, generated with `qemu-dbus-webrtc hash-password`.
method = "password"
# An account that may open every VM. Optional with [[account]] entries.
user = "admin"
password = "$argon2id$v=19$m=19456,t=2,p=1$..."

# Accounts, each with the VMs it may open: by UUID or name (libvirt domain, Proxmox VM ID or
# name), or "*" for all of them. A VM that no account names is open to none.
[[account]]
user = "alice"
password = "$argon2id$v=19$m=19456,t=2,p=1$..."
vms = ["win11-alice", "b8ff54ee-77f5-43dd-aa19-de8eaed5eb75"]
# It may also reset these VMs from the console's toolbar, for a guest that no longer answers
# (through libvirt, or QEMU's QMP socket). Default: false.
power = true
# It may also watch these VMs' sessions (?shadow in the address), and ask to control them, once
# the user signed in to the guest agreed, through the guest agent. Default: false.
shadow = true

[listen]
# Address of the client page and signaling endpoint. Default: 127.0.0.1:8090 (local only).
address = "0.0.0.0:8090"
# Required: the server only serves HTTPS (plain HTTP would expose the sessions, and browsers
# require HTTPS for microphone, camera and clipboard access). From an ACME client of your own
# (certbot, step...), the server restarted once it is renewed.
certificate = "/etc/qemu-dbus-webrtc/tls/cert.pem"
key = "/etc/qemu-dbus-webrtc/tls/key.pem"
# For clients outside the host's network, behind a NAT (a home or office router): the media
# go over UDP, to a port the router must forward to the host, keeping its number. With
# `udp_port`, every session takes its media through that one port (3478, the port of STUN and
# TURN, is often open in office firewalls), and announces `public_address` (an IP address, or
# a name resolved at each session, such as a dynamic DNS name) on it. `udp_ports` instead
# gives each session a port of its own in a range, all of which the router must forward; not
# both. Without these, the clients reach the host on its own addresses only. Open the port in
# the host's firewall too.
# public_address = "vdi.example.com"
# udp_port = 3478
# udp_ports = "40000-40099"
# With no port to forward on most routers, the STUN server: each session asks it for the
# public address and port its router gives it, and the clients ask it for theirs; the two
# sides then open the way through their routers by sending to each other (ICE). This reveals
# the host's and the clients' addresses to the STUN server, nothing else. Not through every
# NAT: some (symmetric) need a TURN relay, below. Default: Google's, as WebRTC clients
# commonly use; "" for none.
# stun = "stun.l.google.com:19302"

# TURN relays, for the clients whose network lets no direct path through (no UDP out, only TCP
# or TLS to port 443): their media go through the relay, still encrypted end to end. The server
# runs none: coturn, or a TURN service. The clients use a relay only when no direct path works;
# "?relay" in the page's address forces it, to check one. Several [[turn]] may be given.
# `urls` (RFC 7065): "turn:host[:port][?transport=udp|tcp]", "turns:host[:port]" over TLS.
# Either `secret`, shared with the relay (coturn: use-auth-secret, static-auth-secret): each
# session gets credentials computed from it, valid for a day; or fixed `username` and
# `credential`, the same for every session and every client.
# [[turn]]
# urls = ["turns:turn.example.com:443?transport=tcp", "turn:turn.example.com:3478"]
# secret = "..."

# A connection broker (ameleo-broker): the deployment's entry point, where users sign in and open
# their VMs. The host connects to it, over gRPC in TLS, and keeps the connection: it announces its
# VMs there and serves the connections the broker relays, the broker having checked the user and
# their access. The host then needs no inbound port: without accounts or without a certificate
# above, it serves no page of its own. `url` is the broker's host service; `host_id` names this
# host among the broker's; `credential_file` holds the credential the broker gave this host
# (readable by the service alone); `ca_bundle`, the roots of the broker's certificate when not
# the system's.
# A connection broker, the deployment's one entry point: the host then serves its VMs through
# it only, and opens no port. Either a broker or direct access, not both: with [broker], the
# host refuses [auth], [[account]], [[turn]] and [listen]'s address, certificate and
# key (its public_address, udp_ports and stun stay, for the media).
# [broker]
# url = "https://broker.example.com:8443"
# host_id = "host-1"
# ca_bundle = "/etc/qemu-dbus-webrtc/broker-ca.pem"
# # The host authenticates to the broker with its certificate (TLS client authentication), from
# # the broker's ACME server: its key in the TPM, proven by device-attest-01. The first time,
# # `qemu-dbus-webrtc enroll --config <this file> <enrollment kid>`, with the enrollment token
# # the broker's administrator made; the host renews it by itself afterwards.
# acme_directory = "https://broker.example.com:8443/acme/directory"
# # The TPM, its TCTI; "none" for a host the broker enrolled without a TPM.
# tpm = "device:/dev/tpmrm0"
# state_dir = "/var/lib/qemu-dbus-webrtc/broker"

[video]
# Video encoding, for all VMs.
# av1, vp9 or hevc (`qemu-dbus-webrtc --codecs` lists what the GPUs encode). Default: av1, or
# vp9 when encoding on the CPU.
codec = "hevc"
# Chroma subsampling: 420 or 444 (VP9 and HEVC only). Default: 420.
chroma = "444"
# Software encoding on the CPU (VP9). Default: false, or true when the host has no hardware
# encoder.
software = false
# Record each screen's stream to <prefix>-<vm uuid>-<console>.<extension>.
# record = "/var/tmp/qdw"

[bitrate]
# Bandwidth estimate bounds per client, in kbit/s: initial value and range.
min = 4000
start = 10000
max = 30000

# VM discovery: all enabled VM managers, plus the static VMs below.

[libvirt]
# libvirt domains with <graphics type='dbus'>. Default: enabled.
enabled = true
# Start a stopped domain when a client requests it (through libvirt-dbus). Default: false;
# without authentication, anyone who can reach the server could start the host's VMs.
start = false
# Directory of libvirt's display buses, used without libvirt-dbus (running domains only).
# dir = "/run/libvirt/qemu/dbus"

[proxmox]
# Proxmox VE VMs started with -display dbus,p2p=on (`args:` in their configuration).
# Default: disabled. Untested.
enabled = false
# run_dir = "/var/run/qemu-server"
# conf_dir = "/etc/pve/qemu-server"

# Static VMs, outside any VM manager above, each with one of: qmp (its QMP socket, for
# -display dbus,p2p=on), dbus (the D-Bus bus on which QEMU owns org.qemu), or domain (a libvirt
# domain name).
[[vm]]
qmp = "/run/qemu/vm.qmp"
