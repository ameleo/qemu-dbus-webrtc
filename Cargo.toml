[workspace]
resolver = "3"
members = ["crates/*", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/ameleo/qemu-dbus-webrtc"
publish = false

[workspace.dependencies]
qdw-audio = { path = "crates/audio" }
qdw-hw-encoder = { path = "crates/hw-encoder" }
qdw-protocol = { path = "crates/protocol" }
qdw-qemu = { path = "crates/qemu" }
qdw-video = { path = "crates/video" }
argon2 = { version = "0.5", features = ["std"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
# TLS with ring: no C toolchain beyond what ring itself needs.
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-sdp = "0.24"
gstreamer-video = "0.24"
gstreamer-webrtc = "0.24"
base64 = "0.22"
bindgen = "0.72"
futures-util = "0.3"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
pkg-config = "0.3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7"
rustix = "1"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

# Password hashes take RFC 9106's parameters (64 MiB, t=3): unoptimized, they take seconds, in
# the tests and in a debug server.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
