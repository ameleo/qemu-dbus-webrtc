[workspace]
resolver = "3"
members = ["crates/*", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/ameleo/qemu-dbus-webrtc"
publish = false

[workspace.dependencies]
qdw-qemu = { path = "crates/qemu" }
qdw-video = { path = "crates/video" }
anyhow = "1"
gstreamer = "0.24"
gstreamer-allocators = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
rustix = "1"
serde_json = "1"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
