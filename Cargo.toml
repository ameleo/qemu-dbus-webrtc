[workspace]
resolver = "3"
members = ["crates/*", "server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/ameleo/qemu-dbus-webrtc"
publish = false

[workspace.dependencies]
qdw-audio = { path = "crates/audio" }
qdw-hw-encoder = { path = "crates/hw-encoder" }
qdw-protocol = { path = "crates/protocol" }
qdw-qemu = { path = "crates/qemu" }
qdw-video = { path = "crates/video" }
qdw-web = { path = "crates/web" }
argon2 = { version = "0.5", features = ["std"] }
anyhow = "1"
# The D-Bus contract of the guest agent, shared with it.
ameleo-display-protocol = { git = "https://github.com/ameleo/ameleo-display-protocol", tag = "v0.4.0" }
axum = { version = "0.8", features = ["ws"] }
# TLS with ring: no C toolchain beyond what ring itself needs.
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
if-addrs = "0.15"
base64 = "0.23"
bindgen = "0.73"
futures-util = "0.3"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
pkg-config = "0.3"
ring = "0.17"
# The host's ACME client to its broker: HTTP/2 with rustls and ring.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# CBOR, for the WebAuthn attestation object of ACME device-attest-01.
ciborium = "0.2"
# The host's TLS to its broker: its certificate, its key in the TPM (tokio-rustls), the system's
# roots (rustls-native-certs), hyper's I/O for tonic's connector.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7"
rustix = "1"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebRTC without a media framework; its crypto in pure Rust, as the rest of the server.
str0m = { version = "0.26", default-features = false }
str0m-rust-crypto = "0.7"
tokio = "1"
# gRPC between a host and its connection broker: generated code only here; the transport, on
# hyper and rustls, where it is used.
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
tokio-stream = "0.1"
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"
zbus = { version = "6", default-features = false, features = ["tokio", "p2p", "proxy", "service"] }

# Password hashes take RFC 9106's parameters (64 MiB, t=3): unoptimized, they take seconds, in
# the tests and in a debug server.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
