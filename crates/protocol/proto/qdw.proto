// SPDX-License-Identifier: MPL-2.0
//
// Messages between qemu-dbus-webrtc and its clients (a browser page, a native client).
//
// A server serves every VM of its host. Signalling runs over a WebSocket at /vm/<id>/signal,
// <id> the VM's UUID or name (its page is /vm/<id>/), one ClientMessage or ServerMessage per
// binary WebSocket message. Whether the VM exists is said only after the hello's account is
// checked: an unknown VM is an Error then, like a wrong account. The exchange:
//
// 1. the client says which video codecs it decodes: ClientMessage.hello;
// 2. the server makes the WebRTC offer (ServerMessage.offer), or refuses (ServerMessage.error):
//    first one video track per guest screen, which it sends, in the order of the screens (0 the
//    first); then the sound, both ways; then the cameras' video tracks, which it receives (see
//    CameraMessage); then the data channels;
// 3. the client answers: ClientMessage.answer;
// 4. both sides trickle their ICE candidates: ClientMessage.ice, ServerMessage.ice.
//
// Compatibility: fields are only ever added, with new numbers; a number is never reused nor
// its type changed.

syntax = "proto3";

package qdw.v1;

message ClientMessage {
  oneof message {
    Hello hello = 1;
    SessionDescription answer = 2;
    IceCandidate ice = 3;
  }
}

message ServerMessage {
  oneof message {
    SessionDescription offer = 1;
    IceCandidate ice = 2;
    Error error = 3;
    Ended ended = 4;
  }
}

// Why the session is over, when there is more to say than its end: the server closes the
// WebSocket right after. The server always ends a session with a Close frame, whose status
// (RFC 6455 7.4.1) says how: 1000, a normal end, the client leaving, the VM stopping, or a
// refusal its Error explains (a native client closes its windows); 1001, the server going
// away, stopped or restarted (it may come back); 1011, a failure of the server (the client may
// try again). A connection lost without a Close frame is a failure of the network, or a crash
// of the server.
message Ended {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // Another client took the session over (one user at a time).
    TAKEN_OVER = 1;
    // The server stops (it is stopped or restarted): the client may connect again later. A
    // crash of the server says nothing: the connection is lost.
    SERVER_STOPPING = 2;
  }
  Reason reason = 1;
}

// The first message of a client.
message Hello {
  // The video codecs the client decodes, as media types ("video/AV1", "video/VP9",
  // "video/H265"), as RTCRtpReceiver.getCapabilities("video") lists them, each with its fmtp
  // parameters when it has any: "video/VP9;profile-id=1" for VP9 in 4:4:4, "video/H265;
  // profile-id=4" for HEVC in 4:4:4 (a format range extensions profile, RFC 7798). A type
  // without parameters stands for the codec's default profile. One more parameter, not an SDP
  // one: "video/AV1;bit-depth=10", "video/H265;bit-depth=10" from a client whose decoder takes
  // the codec in 10 bits (AV1's Main profile has both depths); the server encodes in 10 bits
  // when every client says so. Browsers do not tell it: the page does not send it. For HEVC the
  // offer then gives the profile of the stream at the time it is made (profile-id, tier-flag,
  // level-id, profile-compatibility-indicator, interop-constraints): Main, Main 10, or Main
  // 4:4:4 (10).
  repeated string codecs = 1;
  // Watch only: a shadow client sees and hears the guest, and nothing more. Without it, the
  // client is the user of the session: its keyboard and pointer, clipboard, microphone, drives
  // and printers go to the guest, and the guest takes the size of its window. There is one user
  // at a time: a new one takes the session over, and the server ends the last one's
  // (Ended TAKEN_OVER). Shadow clients watch the user: they stay when another user takes the
  // session over, and their sessions end (a clean close) when the user leaves.
  bool shadow = 2;
  // The server's user and password, when it asks for them (its default): checked before the
  // server starts the VM or attaches to it. None given is answered with the Error "an account
  // is required" at once; a wrong one with "wrong user or password", after a delay; the
  // WebSocket then closes. They open the server's door; the guest's own logon still guards the
  // guest.
  string user = 3;
  string password = 4;
}

message SessionDescription {
  string sdp = 1;
}

message IceCandidate {
  // An empty candidate marks the end of the sender's candidates.
  string candidate = 1;
  uint32 sdp_mline_index = 2;
}

// The session cannot go on; the server closes the WebSocket after it.
message Error {
  string message = 1;
}

// ---------------------------------------------------------------------------------------------
// Data channel "input", client to server, reliable and ordered: one Input per message.
//
// Modelled on the input events of RDP, which solve the same problems.

// A batch of events, applied in order.
message Input {
  repeated InputEvent events = 1;
}

message InputEvent {
  oneof event {
    Key key = 1;
    PointerMove pointer_move = 2;
    PointerButton pointer_button = 3;
    Wheel wheel = 4;
    LockKeys lock_keys = 5;
  }
}

// A key, by its position on the keyboard rather than the character it types: the guest applies
// its own keyboard layout. Key repeats are sent as further presses, as the client's system
// generates them.
message Key {
  // PC scancode, set 1, make code (1 to 127).
  uint32 scancode = 1;
  // The scancode comes with the E0 prefix (right Ctrl, arrows, Insert, the Windows keys...).
  bool extended = 2;
  // The scancode comes with the E1 prefix: only Pause, sent with scancode 0x1D.
  bool extended1 = 3;
  bool down = 4;
}

// The pointer moved to a pixel of a screen.
message PointerMove {
  // The screen, in the order of the video tracks of the offer: 0 for the first.
  uint32 screen = 1;
  uint32 x = 2;
  uint32 y = 3;
}

enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_LEFT = 1;
  BUTTON_MIDDLE = 2;
  BUTTON_RIGHT = 3;
  BUTTON_BACK = 4;
  BUTTON_FORWARD = 5;
}

message PointerButton {
  Button button = 1;
  bool down = 2;
}

// Wheel rotation in 1/120 of a notch, as Windows and RDP count it: high-resolution wheels and
// touchpads send fractions. Positive dy scrolls up (wheel pushed away from the user), positive
// dx scrolls right.
message Wheel {
  int32 dx = 1;
  int32 dy = 2;
}

// The client's lock keys, sent when it gets the focus (and when they may have changed while it
// did not have it): the server toggles the guest's to match.
message LockKeys {
  bool caps_lock = 1;
  bool num_lock = 2;
  bool scroll_lock = 3;
}

// ---------------------------------------------------------------------------------------------
// Data channel "pointer", server to client, reliable and ordered: one PointerUpdate per message.
//
// The guest pointer is not in the video (virtio-gpu draws it on a plane of its own): the client
// draws it, which also keeps it free of the video latency.

message PointerUpdate {
  oneof update {
    PointerShape shape = 1;
    // Whether the guest shows its pointer on this screen.
    bool visible = 2;
  }
  // The guest screen the update is about, as in PointerMove: 0 the first. The guest shows its
  // pointer on the screen it is on, and hides it on the others.
  uint32 screen = 3;
}

message PointerShape {
  uint32 width = 1;
  uint32 height = 2;
  // The pixel that points.
  uint32 hot_x = 3;
  uint32 hot_y = 4;
  // width * height pixels, 4 bytes each: red, green, blue, alpha (not premultiplied).
  bytes rgba = 5;
}

// ---------------------------------------------------------------------------------------------
// Data channel "clipboard", both ways, reliable and ordered: one ClipboardMessage per message.
//
// Modelled on the clipboard of RDP (MS-RDPECLIP): whoever copied last owns the clipboard and
// announces what it holds; the other side asks for the data when it needs it. Data are typed
// by media type: "text/plain;charset=utf-8", "image/png", and for files and directories
// "application/vnd.qdw.file-list", whose data is a ClipboardFileList.
//
// Files, as RDP does: the owner announces the file list type; the other side asks for the
// list, then for the contents of each file by its index in the list, piece by piece
// (ClipboardFileRequest). A paste that takes time first locks the clipboard content
// (ClipboardLock), so that its files stay readable when the clipboard changes, and unlocks it
// at the end.

message ClipboardMessage {
  oneof message {
    ClipboardGrab grab = 1;
    ClipboardRelease release = 2;
    ClipboardRequest request = 3;
    ClipboardData data = 4;
    ClipboardLock lock = 5;
    ClipboardUnlock unlock = 6;
    ClipboardFileRequest file_request = 7;
    ClipboardFileData file_data = 8;
  }
}

// The sender copied: it owns the clipboard, which holds these types.
message ClipboardGrab {
  repeated string mimes = 1;
}

// The sender's clipboard holds nothing to share anymore.
message ClipboardRelease {}

// Ask the owner for its data, in the first of these types it can provide.
message ClipboardRequest {
  // Echoed in the answer.
  uint32 id = 1;
  repeated string mimes = 2;
}

// The answer to a request, in chunks of 60 KiB of data at most (MAX_CHUNK in qdw-protocol): a
// data channel message is 64 KiB at most, whole, unless the other side announces more.
message ClipboardData {
  uint32 id = 1;
  // The type of the data; empty when the owner has nothing to give.
  string mime = 2;
  bytes data = 3;
  // The last chunk of the answer.
  bool last = 4;
}

// The files and directories copied, as the data of the "application/vnd.qdw.file-list" type.
message ClipboardFileList {
  repeated ClipboardFile files = 1;
}

message ClipboardFile {
  // Relative to the copied set, '/' separated; a directory comes before what it contains.
  string path = 1;
  bool directory = 2;
  // In bytes; 0 for a directory.
  uint64 size = 3;
  // Last modification, in milliseconds since 1970-01-01 UTC; 0 if unknown.
  int64 modified_ms = 4;
}

// Freeze the owner's current clipboard content under clip_data_id: its files stay readable after
// the clipboard changes, until unlocked.
message ClipboardLock {
  uint32 clip_data_id = 1;
}

message ClipboardUnlock {
  uint32 clip_data_id = 1;
}

// Ask the owner for the size or a piece of a file of its file list.
message ClipboardFileRequest {
  // Echoed in the answer.
  uint32 id = 1;
  // The index of the file in the file list.
  uint32 index = 2;
  // The size of the file, rather than a piece of it.
  bool size = 3;
  // The piece: offset and length in bytes.
  uint64 offset = 4;
  uint32 length = 5;
  // The locked content the request is about; the current one when absent.
  optional uint32 clip_data_id = 6;
}

// The answer to a ClipboardFileRequest, in chunks as ClipboardData.
message ClipboardFileData {
  uint32 id = 1;
  // The size of the file, for a size request.
  uint64 size = 2;
  // A chunk of the piece, for a piece request.
  bytes data = 3;
  bool last = 4;
  // The file could not be read: no size, no data.
  bool failed = 5;
}

// ---------------------------------------------------------------------------------------------
// Data channel "control", both ways, reliable and ordered: one ControlMessage per message.
// What the client wants of its session, and what the server knows of it.

message ControlMessage {
  oneof message {
    VideoPause video_pause = 1;
    MonitorLayout monitor_layout = 2;
    // Server to client.
    BandwidthEstimate bandwidth_estimate = 3;
    Microphone microphone = 4;
  }
}

// Whether the guest records: an application in the guest has the microphone open. Sent to the
// user's client (not to shadow clients) when the control channel opens, then whenever it
// changes. The client opens its microphone only while `wanted` is true, and closes it
// otherwise; the audio track stays negotiated, without a new offer. The server waits two
// seconds after the guest stops recording before it sends `false`, since applications close
// and open the microphone again within moments.
message Microphone {
  bool wanted = 1;
}

// The server's estimate of the bandwidth to the client (Google Congestion Control, from the
// client's transport-wide congestion control reports): what the connection takes, sound and
// video. Sent when it changes, once a second at most.
message BandwidthEstimate {
  uint32 kbps = 1;
}

// Whether the client wants the video now: paused while its window is hidden or minimized, which
// spares the server the encoding and the network the bits. The sound goes on. When the video
// resumes, the server sends a keyframe at once.
message VideoPause {
  bool paused = 1;
}

// The size the client wants the guest's screen at: the size of its window, in its own pixels,
// so that the video shows unscaled. Sent when the session starts and whenever the window
// changes size; the server waits for the size to settle before applying it. The guest keeps
// it after the client goes. Shadow clients' layouts are ignored.
message MonitorLayout {
  // One guest screen per monitor, in the order of the screens' video tracks: the first monitor
  // shows the first screen. A guest with fewer screens takes the first monitors; its screens
  // beyond the monitors are turned off. The client shows each screen full screen on its
  // monitor: the guest arranges its desktop as the monitors are, and the pointer goes from one
  // screen to the next as from one monitor to the next (PointerMove names the screen).
  repeated Monitor monitors = 1;
}

message Monitor {
  // Where the monitor is among the others, in pixels; 0, 0 for the first.
  int32 x = 1;
  int32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  // Its physical size, for the guest's DPI; 0 when unknown. As in RDP (MS-RDPEDISP 2.2.2.2.1),
  // it is ignored when either dimension is out of 10 to 10,000 millimetres.
  uint32 width_mm = 5;
  uint32 height_mm = 6;
}

// ---------------------------------------------------------------------------------------------
// Data channel "drive", both ways, reliable and ordered: one DriveMessage per message.
//
// Client drives (folders or disks of the client) shown in the guest as drive letters, as RDP
// redirects drives (MS-RDPEFS): every file operation of a guest application goes to the client
// as it happens, and nothing of the client's files stays in the guest. The client announces its
// drives; the server sends it the guest's operations (DriveRequest), with the guest's Windows
// (NT) parameters as they are, and the client answers each (DriveReply) with an NTSTATUS:
// 0 success, 0xC0000034 not found, 0xC0000022 access denied, 0xC0000043 sharing violation...
// Several requests may be pending at once, on the same file too.
//
// Paths are relative to the drive root, '/' separated, without a leading '/'; "" is the root.
// Times are FILETIME: 100 ns since 1601-01-01 UTC, 0 when unknown.
//
// A message larger than a data channel takes (a read or a write carries up to 1 MiB) goes as
// DriveFragment messages: its encoded bytes in pieces of MAX_CHUNK at most, sent one after the
// other with nothing in between, the last one marked.

message DriveMessage {
  oneof message {
    // Client to server.
    DriveAnnounce announce = 1;
    DriveRemove remove = 2;
    DriveChanged changed = 3;
    DriveReply reply = 4;
    // Server to client.
    DriveAdded added = 5;
    DriveRequest request = 6;
    // Both ways.
    DriveFragment fragment = 7;
  }
}

message DriveFragment {
  bytes part = 1;
  bool last = 2;
}

// A drive of the client, to show in the guest. The client chooses the id.
message DriveAnnounce {
  uint32 id = 1;
  // The client's name of the drive ("C").
  string name = 2;
  // The volume label shown in the guest ("C on PC-CLIENT").
  string label = 3;
}

// The client's drive is gone.
message DriveRemove {
  uint32 id = 1;
}

// What became of an announced drive: the guest's drive letter ("Z"), or why it is not shown.
message DriveAdded {
  uint32 id = 1;
  string letter = 2;
  string error = 3;
}

// Changes made on the client drive, in order (FILE_NOTIFY_INFORMATION): the guest refreshes
// what it shows. A client that cannot watch its drive sends none.
message DriveChanged {
  uint32 id = 1;
  repeated DriveChange changes = 2;
}

message DriveChange {
  // 1 added, 2 removed, 3 modified, 4 renamed (old name), 5 renamed (new name).
  uint32 action = 1;
  string path = 2;
}

// A file or directory.
message DriveEntry {
  // Its own name in a listing; the path's last component otherwise.
  string name = 1;
  // FILE_ATTRIBUTE_* flags (0x10: directory).
  uint32 attributes = 2;
  uint64 size = 3;
  uint64 creation_time = 4;
  uint64 last_access_time = 5;
  uint64 last_write_time = 6;
  uint64 change_time = 7;
}

// An operation of the guest on a client drive, as Windows makes it (IRP_MJ_*).
message DriveRequest {
  // Echoed in the reply.
  uint32 request_id = 1;
  uint32 drive_id = 2;
  oneof operation {
    DriveOpen open = 3;
    DriveFile close = 4;
    DriveRead read = 5;
    DriveWrite write = 6;
    DriveFile flush = 7;
    DriveFile query = 8;
    DriveSetBasic set_basic = 9;
    DriveSetSize set_size = 10;
    DriveSetDelete set_delete = 11;
    DriveRename rename = 12;
    DriveList list = 13;
    DriveVolume volume = 14;
  }
}

// IRP_MJ_CREATE, with the guest application's own parameters (NtCreateFile).
message DriveOpen {
  string path = 1;
  uint32 desired_access = 2;
  uint32 file_attributes = 3;
  uint32 share_access = 4;
  // FILE_OPEN 1, FILE_CREATE 2, FILE_OPEN_IF 3, FILE_OVERWRITE 4, FILE_OVERWRITE_IF 5,
  // FILE_SUPERSEDE 0.
  uint32 create_disposition = 5;
  // FILE_DIRECTORY_FILE 0x1, FILE_NON_DIRECTORY_FILE 0x40...
  uint32 create_options = 6;
}

// An open file, by the id the client gave it in its DriveOpened.
message DriveFile {
  uint32 file_id = 1;
}

// At most `length` bytes (1 MiB at most) from `offset`; fewer at the end, none past it.
message DriveRead {
  uint32 file_id = 1;
  uint64 offset = 2;
  uint32 length = 3;
}

// `data` (1 MiB at most) at `offset`.
message DriveWrite {
  uint32 file_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// FileBasicInformation: attributes 0 and times 0 leave them as they are.
message DriveSetBasic {
  uint32 file_id = 1;
  uint32 attributes = 2;
  uint64 creation_time = 3;
  uint64 last_access_time = 4;
  uint64 last_write_time = 5;
}

// The end of file (FileEndOfFileInformation), or with `allocation` the allocation size.
message DriveSetSize {
  uint32 file_id = 1;
  uint64 size = 2;
  bool allocation = 3;
}

// Deleted when the file is closed, or not anymore (FileDispositionInformation). A non-empty
// directory answers STATUS_DIRECTORY_NOT_EMPTY.
message DriveSetDelete {
  uint32 file_id = 1;
  bool delete = 2;
}

// FileRenameInformation: `new_path` from the drive root; `replace` an existing one.
message DriveRename {
  uint32 file_id = 1;
  string new_path = 2;
  bool replace = 3;
}

// The entries of a directory, without "." and "..".
message DriveList {
  string path = 1;
}

// The volume: its size, free space for the user, label and file system.
message DriveVolume {}

// The client's answer to a DriveRequest.
message DriveReply {
  uint32 request_id = 1;
  // NTSTATUS: 0 success.
  uint32 status = 2;
  oneof result {
    DriveOpened opened = 3;
    bytes data = 4;
    uint32 written = 5;
    DriveEntry entry = 6;
    DriveListing listing = 7;
    DriveVolumeInfo volume = 8;
  }
}

message DriveOpened {
  // The client's id for the open file, used by the requests that follow.
  uint32 file_id = 1;
  // What the client did: 0 superseded, 1 opened, 2 created, 3 overwritten.
  uint32 information = 2;
}

message DriveListing {
  repeated DriveEntry entries = 1;
}

message DriveVolumeInfo {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
  string label = 3;
  // "NTFS"...
  string file_system = 4;
}

// ---------------------------------------------------------------------------------------------
// Data channel "printer", both ways, reliable and ordered: one PrinterMessage per message.
//
// Client printers shown in the guest as Windows printers, as RDP redirects printers (Easy
// Print, MS-RDPEPC and MS-RDPEXPS): the guest prints to them as to any printer, and every job
// comes to the client, which prints it on its own printer. The client announces its printers
// with what their driver can do (PrintCapabilities) and its settings (PrintTicket), both Print
// Schema XML as Windows' PrintTicket API gives them; the guest shows the same options.
//
// Jobs come as PrinterJob, PrinterJobData for each piece in order, then PrinterJobEnd; or
// PrinterJobAbort at any time, when the guest cancels the job. A job's document is OpenXPS
// (`application/oxps`) with the job's PrintTicket inside, for the client's driver: print it as
// it is (XPS Print API). The client acknowledges each piece it took (PrinterJobAck): the
// server keeps at most PRINTER_WINDOW (1 MiB) unacknowledged; and tells when it has the whole
// job (PrinterJobDone), with an error if it could not print it.
//
// A message larger than a data channel takes (a piece of a job, capabilities or tickets of up
// to 4 MiB) goes as PrinterFragment messages, as for the drives.

message PrinterMessage {
  oneof message {
    // Client to server.
    PrinterAnnounce announce = 1;
    PrinterRemove remove = 2;
    PrinterJobAck job_ack = 3;
    PrinterJobDone job_done = 4;
    PrinterPropertiesDone properties_done = 5;
    // Server to client.
    PrinterAdded added = 6;
    PrinterJob job = 7;
    PrinterJobData job_data = 8;
    PrinterJobEnd job_end = 9;
    PrinterJobAbort job_abort = 10;
    PrinterProperties properties = 11;
    // Both ways.
    PrinterFragment fragment = 12;
  }
}

message PrinterFragment {
  bytes part = 1;
  bool last = 2;
}

// A printer of the client, to show in the guest. The client chooses the id.
message PrinterAnnounce {
  uint32 id = 1;
  // Shown in the guest.
  string name = 2;
  // The client's default printer: made the default printer in the guest.
  bool is_default = 3;
  // The driver's PrintCapabilities XML; empty: the guest printer has generic options only.
  string capabilities = 4;
  // The PrintTicket of the printer's default settings (the user's printing preferences on the
  // client): the guest printer's defaults. Empty: the guest guesses them.
  string default_ticket = 5;
}

// The client's printer is gone.
message PrinterRemove {
  uint32 id = 1;
}

// What became of an announced printer: empty error when the guest installs it (at once, or
// when its user logs on).
message PrinterAdded {
  uint32 id = 1;
  string error = 2;
}

// A job begins on printer `printer_id`. The server chooses the job id.
message PrinterJob {
  uint32 job_id = 1;
  uint32 printer_id = 2;
  // The document's media type: "application/oxps".
  string document_format = 3;
  // As the guest application and user gave them; may be empty.
  string job_name = 4;
  string user_name = 5;
  // The job's settings, for the client's driver; the document carries them already
  // (Metadata/Job_PT.xml): given for information.
  string print_ticket = 6;
}

// The next piece of a job's document.
message PrinterJobData {
  uint32 job_id = 1;
  bytes data = 2;
}

// The client took `bytes` more bytes of the job.
message PrinterJobAck {
  uint32 job_id = 1;
  uint32 bytes = 2;
}

// The whole document was sent.
message PrinterJobEnd {
  uint32 job_id = 1;
}

// The guest cancelled the job: drop it.
message PrinterJobAbort {
  uint32 job_id = 1;
}

// The client has the whole job and handed it to its printer, or could not (`error`).
message PrinterJobDone {
  uint32 job_id = 1;
  string error = 2;
}

// Show the driver's own document properties dialog of printer `printer_id`, starting from
// `print_ticket` (the guest printer's current settings: the ticket the user chose last, whose
// PageDevmodeSnapshot, in the driver's namespace, is the DEVMODE to start the dialog from).
// The user may keep the dialog open as long as they like.
message PrinterProperties {
  uint32 request_id = 1;
  uint32 printer_id = 2;
  string print_ticket = 3;
}

// The dialog was closed: the PrintTicket the user chose, or `cancelled`.
message PrinterPropertiesDone {
  uint32 request_id = 1;
  string print_ticket = 2;
  bool cancelled = 3;
}

// ---------------------------------------------------------------------------------------------
// Data channel "camera", both ways, reliable and ordered: one CameraMessage per message.
//
// Client cameras shown in the guest as cameras, as RDP redirects them (MS-RDPECAM). The client
// announces its cameras, with the formats each can send and its controls (brightness, focus...).
// When a guest application opens one, the server asks the client to start it in one of those
// formats (CameraStart): the client sends it as H.264 on the video track of the offer whose
// mid the server names, one of the offer's receive-only H.264 tracks kept for the cameras (no
// renegotiation: the client sets the transceiver's direction to send when it answers, and
// replaces the sender's track). The server relays the H.264 to the guest as it is. When no
// application uses it anymore, CameraStop: the client stops sending (replaceTrack(null)).
// When the guest's decoder loses track, the server asks the client for a keyframe on that
// track (RTCP PLI), as a browser does.
//
// Controls are numbered as in MS-RDPECAM: sets 1 CameraControl (1 exposure, 2 focus, 3 pan,
// 4 roll, 5 tilt, 6 zoom) and 2 VideoProcAmp (1 backlight compensation, 2 brightness,
// 3 contrast, 4 hue, 5 white balance); capabilities and modes 1 manual, 2 auto. Only the user
// shares cameras, not shadow clients.

message CameraMessage {
  oneof message {
    // Client to server.
    CameraAnnounce announce = 1;
    CameraRemove remove = 2;
    // The value a control has now, after a CameraSetControl or at any time.
    CameraControlValue control_value = 3;
    // Server to client.
    CameraAdded added = 4;
    CameraStart start = 5;
    CameraStop stop = 6;
    CameraControlValue set_control = 7;
  }
}

// A camera of the client, to show in the guest. The client chooses the id.
message CameraAnnounce {
  uint32 id = 1;
  // Shown in the guest.
  string name = 2;
  // What the camera can send, in H.264; CameraStart names one by its index in this list.
  repeated CameraFormat formats = 3;
  repeated CameraControl controls = 4;
}

message CameraFormat {
  uint32 width = 1;
  uint32 height = 2;
  uint32 fps_numerator = 3;
  uint32 fps_denominator = 4;
}

// A control the camera offers (PROPERTY_DESCRIPTION), and its value now (PROPERTY_VALUE).
message CameraControl {
  uint32 set = 1;
  uint32 property = 2;
  uint32 capabilities = 3;
  int32 min = 4;
  int32 max = 5;
  int32 step = 6;
  int32 default = 7;
  uint32 mode = 8;
  int32 value = 9;
}

// The client's camera is gone.
message CameraRemove {
  uint32 id = 1;
}

// What became of an announced camera: empty error when the guest shows it.
message CameraAdded {
  uint32 id = 1;
  string error = 2;
}

// Send camera `id` in format `format` (an index in its CameraAnnounce) on the track of `mid`.
message CameraStart {
  uint32 id = 1;
  uint32 format = 2;
  string mid = 3;
}

// Stop sending camera `id`.
message CameraStop {
  uint32 id = 1;
}

// A control's value: the one the guest asks for (server to client: `value` means nothing in
// mode 2, auto), or the one the camera took (client to server).
message CameraControlValue {
  uint32 id = 1;
  uint32 set = 2;
  uint32 property = 3;
  uint32 mode = 4;
  int32 value = 5;
}
