name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    # A run takes about two minutes; a mirror or network failure must not hold it for long.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Development files of libva, libvpx and libopus
        if: hashFiles('Cargo.toml') != ''
        # bindgen generates the bindings to them, with libclang.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libva-dev libvpx-dev libopus-dev libclang-dev
      - name: Format
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check
      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: hashFiles('Cargo.toml') != ''
        # Every crate's tests, even after one fails.
        run: cargo test --workspace --no-fail-fast
