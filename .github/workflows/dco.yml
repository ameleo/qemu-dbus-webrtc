name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $c has no 'Signed-off-by: $author' line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
